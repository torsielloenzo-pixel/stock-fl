<style>
:root{--red:#ff2f1f;--orange:#ff8500;--grad:linear-gradient(135deg,#ff2f1f 0%,#ff151f 44%,#ff8500 100%);--line:#e5e7eb;--text:#182235;--muted:#777}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 0 20%,#ff2f1f0b,transparent 28%),radial-gradient(circle at 100% 85%,#ff85000b,transparent 30%),#f7f8fa}button,input{font:inherit}button{cursor:pointer}
header{height:68px;background:#ffffffef;border-bottom:1px solid #e5e7eb;box-shadow:0 5px 20px #0000000a;position:sticky;top:0;z-index:40}header:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--grad)}.top{width:min(94vw,1120px);height:100%;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.mark{width:40px;height:40px;border:0;border-radius:11px;background:var(--grad);color:#fff;font-weight:950;font-size:20px;box-shadow:0 6px 16px #ff3b1f2d}.title{font-weight:900;font-size:18px}.sub{font-size:10px;color:#888;margin-top:2px}
.nMenuWrap{position:relative}.nMenu{position:absolute;left:0;top:49px;width:255px;padding:8px;background:#fffffff8;border:1px solid #dedee2;border-radius:15px;box-shadow:0 16px 44px #0003;backdrop-filter:blur(16px);z-index:100}.hidden{display:none!important}.nMenuTitle{padding:7px 10px 8px;color:#f33a22;font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.8px}.nMenu button{width:100%;display:grid;grid-template-columns:34px 1fr;gap:9px;align-items:center;text-align:left;padding:9px;border:0;border-radius:10px;background:transparent}.nMenu button:hover{background:linear-gradient(90deg,#fff1ef,#fff8ef)}.nMenu button>span{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#fff0ed,#fff7ec);color:#f43a20;display:grid;place-items:center}.nMenu button strong{display:block;font-size:12px}.nMenu button small{display:block;font-size:10px;color:#888;margin-top:2px}.navToolLogo{background-size:cover!important;background-position:center!important;color:transparent!important}.navToolLogo.stock{background-image:url('assets/logo-stock.svg')!important}.navToolLogo.planning{background-image:url('assets/logo-planning.svg')!important}.navToolLogo.equipe{background-image:url('assets/logo-equipe.svg')!important}.navToolLogo.article{background-image:url('assets/logo-article.svg')!important}
main{width:min(94vw,1120px);margin:auto;padding:34px 0 60px}.hero{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:18px}.hero h1{font-size:34px;margin:0 0 6px;letter-spacing:-.8px}.hero p{margin:0;color:#777;font-size:12px}.countBox{padding:10px 13px;border-radius:13px;background:#fff;border:1px solid var(--line);font-size:11px;color:#777;box-shadow:0 5px 16px #00000008}.countBox strong{color:#f33a22;font-size:16px;margin-right:3px}
.controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin-bottom:15px}.search{height:46px;border:1px solid #dfe1e5;border-radius:14px;padding:0 14px;background:#fff;outline:none}.search:focus{border-color:#ff6a3d88;box-shadow:0 0 0 3px #ff5a2a16}.filters{display:flex;padding:4px;background:#fff;border:1px solid #e1e3e6;border-radius:13px;gap:3px}.filter{border:0;background:transparent;border-radius:9px;padding:8px 11px;font-weight:800;font-size:10px;color:#777}.filter.active{background:var(--grad);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid #e4e6e9;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px #1a22300b;display:flex;flex-direction:column}.photo{height:145px;background:linear-gradient(145deg,#f3f4f6,#eceef1);display:grid;place-items:center;font-size:38px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:14px}.statusRow{display:flex;justify-content:space-between;align-items:start;gap:8px}.name{font-size:17px;font-weight:900;line-height:1.1}.cat{font-size:10px;color:#888;margin-top:4px}.badge{flex:none;border-radius:999px;padding:5px 8px;font-size:8px;font-weight:900;letter-spacing:.4px}.badge.on{background:#e9f8ee;color:#238343}.badge.off{background:#fff0ed;color:#c93620}.facts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:13px}.fact{background:#f7f8fa;border:1px solid #eceef1;border-radius:11px;padding:9px}.fact span{display:block;font-size:8px;color:#999;font-weight:800;text-transform:uppercase;letter-spacing:.4px}.fact strong{display:block;font-size:11px;margin-top:3px;overflow-wrap:anywhere}.ean{grid-column:1/-1}.foot{margin-top:auto;border-top:1px solid #eee;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.switchWrap{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:800;min-width:0;flex:1}.switch{position:relative;width:42px;height:24px;border:0;border-radius:99px;background:#d7d9dd;padding:0;transition:.2s}.switch:before{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 5px #0002;transition:.2s}.switch.on{background:linear-gradient(90deg,#ff3822,#ff8500)}.switch.on:before{transform:translateX(18px)}.switch:disabled{opacity:.5;cursor:default}.openBtn{border:0;border-radius:10px;padding:8px 10px;background:#f0f1f3;font-size:9px;font-weight:800}.empty{grid-column:1/-1;padding:50px;text-align:center;color:#999;background:#fff;border:1px dashed #ddd;border-radius:18px}
:root[data-theme="dark"]{color-scheme:dark}:root[data-theme="dark"] body{background:#111317;color:#f4f4f5}:root[data-theme="dark"] header{background:#17191df0;border-color:#2d3036}:root[data-theme="dark"] .card,:root[data-theme="dark"] .countBox,:root[data-theme="dark"] .filters,:root[data-theme="dark"] .search{background:#1b1d22;border-color:#30333a;color:#f4f4f5}:root[data-theme="dark"] .fact{background:#202329;border-color:#31343a}:root[data-theme="dark"] .foot{border-color:#30333a}:root[data-theme="dark"] .openBtn{background:#26282e;color:#eee}:root[data-theme="dark"] .nMenu{background:#1c1d20f8;border-color:#38393e}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){header{height:62px}.top{width:calc(100% - 18px)}.sub{display:none}main{width:calc(100% - 20px);padding:22px 0 38px}.hero{align-items:start}.hero h1{font-size:27px}.countBox{padding:8px 10px}.controls{grid-template-columns:1fr}.filters{width:100%}.filter{flex:1}.grid{grid-template-columns:1fr}.photo{height:125px}.nMenu{position:fixed!important;left:10px!important;right:10px!important;top:auto!important;bottom:10px!important;width:auto!important;max-height:74dvh;overflow:auto;border-radius:20px!important;padding:10px!important}.nMenu:before{content:"";display:block;width:42px;height:4px;background:#c9c9ce;border-radius:99px;margin:1px auto 8px}.nMenu button{min-height:50px;grid-template-columns:38px 1fr}.nMenu button>span{width:36px;height:36px}}

.mobileNavBackdrop{display:none}

  body.mobileNavOpen #nMenu{
    display:block!important;position:fixed!important;left:10px!important;right:10px!important;top:max(64px,calc(env(safe-area-inset-top) + 50px))!important;bottom:auto!important;
    width:auto!important;max-width:none!important;max-height:calc(100dvh - max(82px,calc(env(safe-area-inset-top) + 68px)))!important;
    overflow-y:auto!important;-webkit-overflow-scrolling:touch!important;overscroll-behavior:contain!important;
    padding:9px!important;border-radius:20px!important;z-index:999!important;
    box-shadow:0 22px 70px rgba(0,0,0,.32)!important
  }
  body.mobileNavOpen #nMenu:before{display:none!important}
}
@media(max-width:390px){.foot{align-items:stretch}.switchWrap{width:100%;flex-basis:100%}.openBtn{width:100%;min-height:38px}.hero{flex-wrap:wrap}.countBox{margin-left:auto}}\n</style>

<body><div class="mobileNavBackdrop" onclick="closeNMenu()"></div>
<header><div class="top"><div class="brand"><div class="nMenuWrap"><button class="mark" onclick="location.href='home.html'">N</button><div id="nMenu" class="nMenu hidden"><div class="nMenuTitle">Navigation</div><button onclick="location.href='home.html'"><span>⌂</span><div><strong>Accueil</strong><small>Choisir un outil</small></div></button><button onclick="location.href='profile.html'"><span>☺</span><div><strong>Mon profil</strong><small>Photo et compte</small></div></button><button onclick="location.href='index.html'"><span class="navToolLogo stock"></span><div><strong>Stock F&amp;L</strong><small>Gestion du stock</small></div></button><button onclick="location.href='planning.html'"><span class="navToolLogo planning"></span><div><strong>Planning</strong><small>Horaires de l'équipe</small></div></button><button onclick="location.href='chat.html'"><span class="navToolLogo equipe"></span><div><strong>Équipe</strong><small>Messagerie interne</small></div></button><button onclick="location.href='articles.html'"><span class="navToolLogo article"></span><div><strong>Fiches articles</strong><small>Référentiel EAN</small></div></button><button id="settingsLink" class="hidden" onclick="location.href='settings.html'"><span>⚙</span><div><strong>Personnalisation</strong><small>Réglages du portail</small></div></button><button onclick="toggleTheme(event)"><span class="themeIcon">☾</span><div><strong class="themeLabel">Mode sombre</strong><small>Changer l'apparence</small></div></button><button onclick="logout()"><span>↪</span><div><strong>Déconnexion</strong><small>Quitter la session</small></div></button></div></div><div><div class="title">Fiches articles</div><div class="sub">Référentiel produit interne</div></div></div></div></header>
<main><div class="hero"><div><h1>Référentiel EAN</h1><p>Une fiche par référence EAN, indépendamment de son affichage dans le stock.</p></div><div class="countBox"><strong id="count">0</strong> fiches</div></div><div class="controls"><input id="search" class="search" type="search" placeholder="Rechercher nom, EAN ou code article…" oninput="render()"><div class="filters"><button class="filter active" data-filter="all" onclick="setFilter('all')">Toutes</button><button class="filter" data-filter="on" onclick="setFilter('on')">En vente</button><button class="filter" data-filter="off" onclick="setFilter('off')">Hors vente</button></div></div><div id="grid" class="grid"><div class="empty">Chargement…</div></div></main>
<script>
const SUPABASE_URL='https://gioxrpaiwogqqtakjpnv.supabase.co',SUPABASE_KEY='sb_publishable_nJPMS-Z_20ng1aMJmufbmg_gWFFndrC',db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let profile=null,items=[],filter='all';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function toggleMenu(e){e?.stopPropagation();$('nMenu').classList.toggle('hidden')}document.addEventListener('click',e=>{if(!e.target.closest('.nMenuWrap'))$('nMenu').classList.add('hidden')});
function currentTheme(){return document.documentElement.dataset.theme==='dark'?'dark':'light'}function applyTheme(t){t=t==='dark'?'dark':'light';document.documentElement.dataset.theme=t;localStorage.setItem('nettoTheme',t);document.querySelectorAll('.themeIcon').forEach(x=>x.textContent=t==='dark'?'☀':'☾');document.querySelectorAll('.themeLabel').forEach(x=>x.textContent=t==='dark'?'Mode clair':'Mode sombre')}function toggleTheme(e){e?.stopPropagation();applyTheme(currentTheme()==='dark'?'light':'dark')}
function setFilter(v){filter=v;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter===v));render()}
function filtered(){const q=$('search').value.trim().toLocaleLowerCase('fr');return items.filter(p=>(filter==='all'||(filter==='on'?p.on_sale:!p.on_sale))&&(!q||[p.name,p.ean,p.article_code,p.category,p.packaging].some(v=>String(v||'').toLocaleLowerCase('fr').includes(q))))}
function render(){const list=filtered();$('count').textContent=list.length;const g=$('grid');if(!list.length){g.innerHTML='<div class="empty">Aucune fiche article ne correspond à cette recherche.</div>';return}g.innerHTML=list.map(p=>'<article class="card"><div class="photo">'+(p.photo_url?'<img src="'+esc(p.photo_url)+'" alt="">':'📦')+'</div><div class="body"><div class="statusRow"><div><div class="name">'+esc(p.name||'Article')+'</div><div class="cat">'+esc(p.category||'Sans catégorie')+'</div></div><span class="badge '+(p.on_sale?'on':'off')+'">'+(p.on_sale?'EN VENTE':'HORS VENTE')+'</span></div><div class="facts"><div class="fact ean"><span>EAN</span><strong>'+esc(p.ean)+'</strong></div><div class="fact"><span>Code article</span><strong>'+esc(p.article_code||'—')+'</strong></div><div class="fact"><span>Conditionnement</span><strong>'+esc(p.packaging||'—')+(p.packaging_count?' · '+esc(p.packaging_count):'')+'</strong></div></div></div><div class="foot"><div class="switchWrap"><button class="switch '+(p.on_sale?'on':'')+'" '+(profile?.role==='admin'?'':'disabled')+' onclick="toggleSale(\''+p.id+'\')" aria-label="Changer le statut en vente"></button><span>'+(p.on_sale?'Affiché dans le stock':'Masqué du stock')+'</span></div>'+(p.on_sale?'<button class="openBtn" onclick="location.href=\'index.html?ean='+encodeURIComponent(p.ean)+'\'">Voir dans le stock</button>':'')+'</div></article>').join('')}
async function toggleSale(id){if(profile?.role!=='admin')return;const p=items.find(x=>x.id===id);if(!p)return;const next=!p.on_sale;const {error}=await db.from('products').update({on_sale:next}).eq('id',id);if(error)return alert('Modification impossible : '+error.message);p.on_sale=next;render()}
async function load(){const {data,error}=await db.from('products').select('id,name,category,photo_url,article_code,ean,packaging,packaging_count,on_sale,active').eq('active',true).not('ean','is',null).neq('ean','').order('category').order('name');if(error){$('grid').innerHTML='<div class="empty">Impossible de charger les fiches articles.</div>';return}items=data||[];render()}
async function logout(){await db.auth.signOut();location.href='index.html'}
async function boot(){const {data:{session}}=await db.auth.getSession();if(!session)return location.replace('index.html');const {data:p,error}=await db.from('profiles').select('display_name,email,role').eq('id',session.user.id).maybeSingle();if(error||!p)return location.replace('index.html');profile=p;$('settingsLink').classList.toggle('hidden',p.role!=='admin');applyTheme(currentTheme());await load()}
boot();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
