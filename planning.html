let current=2,drag=false,paint=true;
function slots(){return Array.from({length:29},(_,i)=>6+i*.5)}
function baseState(day){const s={};names.forEach(n=>{s[n]={};(day.blocks[n]||[]).forEach(([a,b,c])=>slots().forEach(t=>{if(t>=+a&&t<+b)s[n][t]=c}))});return s}
function getState(){try{return JSON.parse(localStorage.getItem('nettoPlanningV1'))||{}}catch{return {}}}
const DATA_VERSION='photo-planning-v2';
let all=getState();
if(localStorage.getItem('nettoPlanningDataVersion')!==DATA_VERSION){
 all={};days.forEach(d=>all[d.k]=baseState(d));
 localStorage.setItem('nettoPlanningV1',JSON.stringify(all));
 localStorage.setItem('nettoPlanningDataVersion',DATA_VERSION);
}else{
 days.forEach(d=>{if(!all[d.k])all[d.k]=baseState(d)});
}
function save(){localStorage.setItem('nettoPlanningV1',JSON.stringify(all));const e=document.getElementById('saveState');e.textContent='✓ Enregistré';setTimeout(()=>e.textContent='Modifications enregistrées automatiquement',900)}

function apply(el){const d=days[current],n=el.dataset.n,t=el.dataset.t;all[d.k][n]??={};if(paint){const existing=all[d.k][n][t];all[d.k][n][t]=existing?existing:'g'}else delete all[d.k][n][t];save();render()}
