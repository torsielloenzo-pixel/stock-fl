let current=2,paintColor='g',editMode=false;
function slots(){return Array.from({length:29},(_,i)=>6+i*.5)}
function baseState(day){const s={};names.forEach(n=>{s[n]={};(day.blocks[n]||[]).forEach(([a,b,c])=>slots().forEach(t=>{if(t>=+a&&t<+b)s[n][String(t)]=c}))});return s}
function normalizeDayState(day,state){
 const base=baseState(day);
 if(!state||typeof state!=='object')return base;
 names.forEach(n=>{
   if(!state[n]||typeof state[n]!=='object')state[n]={};
   Object.keys(base[n]).forEach(t=>{if(state[n][t]===undefined)state[n][t]=base[n][t]});
 });
 return state;
}
function getState(){try{return JSON.parse(localStorage.getItem('nettoPlanningV1'))||{}}catch{return {}}}
const DATA_VERSION='photo-planning-v3-visible';
let all=getState();
if(localStorage.getItem('nettoPlanningDataVersion')!==DATA_VERSION){
 all={};days.forEach(d=>all[d.k]=baseState(d));
 localStorage.setItem('nettoPlanningV1',JSON.stringify(all));
 localStorage.setItem('nettoPlanningDataVersion',DATA_VERSION);
}else{
 days.forEach(d=>{all[d.k]=normalizeDayState(d,all[d.k])});
}
function save(){localStorage.setItem('nettoPlanningV1',JSON.stringify(all));const e=document.getElementById('saveState');e.textContent='✓ Enregistré';setTimeout(()=>e.textContent=editMode?'Mode modification':'Lecture seule',900)}

function render(){renderDays();const d=days[current],dateTitle=document.getElementById('dateTitle'),grid=document.getElementById('grid');dateTitle.textContent=d.label+' '+d.date;let h='<div class="name headName">Employé</div>'+slots().map((t,i)=>'<div class="time">'+(i===slots().length-1?'20:00–20:30':fmt(t))+'</div>').join('')+'<div class="time">Total</div>';names.forEach(n=>{h+='<div class="name">'+n+'</div>';let count=0;slots().forEach(t=>{const c=all[d.k]?.[n]?.[String(t)];if(c==='g'||c==='b')count++;h+='<div class="cell '+(c?'on':'')+(editMode?' editable':'')+'" style="'+(c?'--c:'+colors[c]:'')+'" data-n="'+n+'" data-t="'+t+'"></div>'});h+='<div class="total">'+(count*.5).toFixed(1).replace('.',',')+' h</div>'});grid.innerHTML=h;if(editMode){grid.querySelectorAll('.cell').forEach(el=>{el.onclick=e=>{e.preventDefault();apply(el)}})}}
function apply(el){if(!editMode)return;playUISound('tick');const d=days[current],n=el.dataset.n,t=el.dataset.t;all[d.k][n]??={};if(paintColor==='erase')delete all[d.k][n][t];else all[d.k][n][t]=paintColor;save();render()}
