let current=2,paintColor='g',editMode=false;
function slots(){return Array.from({length:29},(_,i)=>6+i*.5)}
function baseState(day){const s={};names.forEach(n=>{s[n]={};(day.blocks[n]||[]).forEach(([a,b,c])=>slots().forEach(t=>{if(t>=+a&&t<+b)s[n][String(t)]=c}))});return s}
function normalizeDayState(day,state){
 const base=baseState(day);
 if(!state||typeof state!=='object')return base;
 names.forEach(n=>{
   if(!state[n]||typeof state[n]!=='object')state[n]={};
   Object.keys(base[n]).forEach(t=>{if(state[n][t]===undefined)state[n][t]=base[n][t]});
 });
 return state;
}
function getState(){try{return JSON.parse(localStorage.getItem('nettoPlanningV1'))||{}}catch{return {}}}

 localStorage.setItem('nettoPlanningV1',JSON.stringify(all));
 localStorage.setItem('nettoPlanningDataVersion',DATA_VERSION);

 days.forEach(d=>{all[d.k]=normalizeDayState(d,all[d.k])});

function setMenuEntry(urlKey,cfg){

 const old=defaults[urlKey];
 document.querySelectorAll('#nMenu button,#brandMenu button').forEach(b=>{
  const oc=b.getAttribute('onclick')||'';
  if(!oc.includes("'"+old+"'")&&!oc.includes('"'+old+'"'))return;
  const icon=b.querySelector(':scope > span'),strong=b.querySelector('strong'),small=b.querySelector('small');
  if(icon)icon.textContent=n.icon||icon.textContent;if(strong)strong.textContent=n.label||strong.textContent;if(small)small.textContent=n.subtitle||'';
  const target=String(n.url||old).replace(/['"<>]/g,'');b.onclick=()=>location.href=target;
 });
}

 const settings=document.querySelectorAll('.settingsLink');settings.forEach(x=>x.classList.toggle('hidden',!(window.currentRole==='admin'||window.planningCanEdit||profile?.role==='admin')));
