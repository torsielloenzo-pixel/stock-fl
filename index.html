<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Stock FL</title>
<style>
:root{--bg:#f4f4f6;--card:#fff;--text:#171717;--muted:#747474;--line:#e6e6e8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(244,244,246,.92);backdrop-filter:blur(14px);padding:calc(12px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.title{font-size:27px;font-weight:800}
button{font:inherit;border:0;cursor:pointer}.manage{background:#111;color:white;border-radius:12px;padding:10px 13px;font-weight:700}
main{padding:14px 12px calc(30px + env(safe-area-inset-bottom));max-width:850px;margin:auto}
.category{margin-bottom:22px}.catTitle{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:800;margin:4px 2px 10px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--card);border-radius:17px;padding:9px;box-shadow:0 1px 3px #00000012;min-width:0}
.photo{width:100%;aspect-ratio:1.65/1;object-fit:cover;border-radius:12px;background:#ececef;display:block}
.placeholder{width:100%;aspect-ratio:1.65/1;border-radius:12px;background:#ececef;display:grid;place-items:center;font-size:34px}
.name{font-weight:750;font-size:15px;margin:8px 2px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.counter{display:grid;grid-template-columns:42px 1fr 42px;gap:6px;align-items:center}
.counter button{height:40px;border-radius:11px;background:#ededf0;font-size:24px;font-weight:600}
.counter .plus{background:#111;color:#fff}.qty{text-align:center;font-size:20px;font-weight:800}.zero .qty{color:#d20b19}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:55px;height:55px;border-radius:50%;background:#111;color:white;font-size:29px;box-shadow:0 6px 18px #0004}
dialog{border:0;border-radius:20px;width:min(92vw,460px);padding:0;box-shadow:0 20px 60px #0005}dialog::backdrop{background:#0007}
.modal{padding:18px}.modal h2{margin:0 0 15px}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--muted);font-weight:700;margin-bottom:6px}
input,select{width:100%;padding:12px;border:1px solid #d7d7da;border-radius:11px;font:inherit;background:white}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:17px}.actions button{padding:11px 14px;border-radius:11px;font-weight:700}.secondary{background:#ededf0}.primary{background:#111;color:white}
.manageList{max-height:55vh;overflow:auto}.manageRow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.manageRow span{flex:1;font-weight:650}.delete{background:#ffe5e7;color:#b0000d;padding:8px 10px;border-radius:9px}
.small{font-size:12px;color:var(--muted);margin-top:4px}@media(max-width:350px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="top"><div><div class="title">📦 Stock</div><div class="small">Fruits & légumes • pas de 0,5</div></div><button class="manage" onclick="openManage()">Gérer</button></div></header>
<main id="app"></main>
<button class="fab" aria-label="Ajouter un produit" onclick="openAdd()">+</button>
<dialog id="addDialog"><form class="modal" onsubmit="saveProduct(event)">
<h2>Ajouter un produit</h2>
<div class="field"><label>Nom</label><input id="pName" required placeholder="Ex. Banane"></div>
<div class="field"><label>Catégorie</label><select id="pCat"><option>Fruits</option><option>Légumes</option><option>Salades</option><option>Autres</option></select></div>
<div class="field"><label>Quantité de départ</label><input id="pQty" type="number" min="0" step="0.5" value="0"></div>
<div class="field"><label>Photo</label><input id="pPhoto" type="file" accept="image/*"></div>
<div class="actions"><button type="button" class="secondary" onclick="addDialog.close()">Annuler</button><button class="primary">Ajouter</button></div>
</form></dialog>
<dialog id="manageDialog"><div class="modal"><h2>Gérer les produits</h2><div id="manageList" class="manageList"></div><div class="actions"><button class="primary" onclick="manageDialog.close()">Terminé</button></div></div></dialog>
<script>
const KEY='stock-fl-v1';
const categoryMeta={'Fruits':{color:'#e1252d',emoji:'🍎'},'Légumes':{color:'#31a354',emoji:'🥬'},'Salades':{color:'#79b943',emoji:'🥗'},'Autres':{color:'#777',emoji:'📦'}};
let products=JSON.parse(localStorage.getItem(KEY)||'null') || [
{id:crypto.randomUUID(),name:'Banane',cat:'Fruits',qty:2,photo:''},{id:crypto.randomUUID(),name:'Kiwi',cat:'Fruits',qty:1,photo:''},{id:crypto.randomUUID(),name:'Mangue',cat:'Fruits',qty:0,photo:''},{id:crypto.randomUUID(),name:'Ananas',cat:'Fruits',qty:1,photo:''},{id:crypto.randomUUID(),name:'Céleri',cat:'Légumes',qty:2,photo:''},{id:crypto.randomUUID(),name:'Sucrine',cat:'Légumes',qty:1,photo:''},{id:crypto.randomUUID(),name:'Courgette',cat:'Légumes',qty:0,photo:''},{id:crypto.randomUUID(),name:'Aubergine',cat:'Légumes',qty:1,photo:''}
];
function persist(){localStorage.setItem(KEY,JSON.stringify(products))}
function fmt(n){return Number.isInteger(n)?String(n):String(n).replace('.',',')}
function render(){const app=document.getElementById('app');app.innerHTML='';Object.keys(categoryMeta).forEach(cat=>{const items=products.filter(p=>p.cat===cat);if(!items.length)return;const s=document.createElement('section');s.className='category';s.innerHTML=`<div class="catTitle"><span class="dot" style="background:${categoryMeta[cat].color}"></span>${cat}</div><div class="grid"></div>`;const g=s.querySelector('.grid');items.forEach(p=>{const c=document.createElement('div');c.className='card'+(p.qty===0?' zero':'');const visual=p.photo?`<img class="photo" src="${p.photo}" alt="">`:`<div class="placeholder">${categoryMeta[p.cat].emoji}</div>`;c.innerHTML=`${visual}<div class="name">${escapeHtml(p.name)}</div><div class="counter"><button onclick="change('${p.id}',-.5)">−</button><div class="qty">${fmt(p.qty)}</div><button class="plus" onclick="change('${p.id}',.5)">+</button></div>`;g.appendChild(c)});app.appendChild(s)})}
function change(id,d){const p=products.find(x=>x.id===id);p.qty=Math.max(0,Math.round((p.qty+d)*2)/2);persist();render()}
function openAdd(){document.getElementById('addDialog').showModal()}
function saveProduct(e){e.preventDefault();const f=document.getElementById('pPhoto').files[0];const finish=photo=>{products.push({id:crypto.randomUUID(),name:pName.value.trim(),cat:pCat.value,qty:Math.max(0,Number(pQty.value)||0),photo});persist();render();e.target.reset();pQty.value=0;addDialog.close()};if(!f)return finish('');const reader=new FileReader();reader.onload=()=>resizeImage(reader.result,finish);reader.readAsDataURL(f)}
function resizeImage(src,cb){const img=new Image();img.onload=()=>{const max=700,scale=Math.min(1,max/img.width);const c=document.createElement('canvas');c.width=img.width*scale;c.height=img.height*scale;c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};img.src=src}
function openManage(){const l=document.getElementById('manageList');l.innerHTML='';products.forEach(p=>{const r=document.createElement('div');r.className='manageRow';r.innerHTML=`<span>${escapeHtml(p.name)} <small>(${p.cat})</small></span><button class="delete" onclick="removeProduct('${p.id}')">Supprimer</button>`;l.appendChild(r)});manageDialog.showModal()}
function removeProduct(id){if(confirm('Supprimer ce produit ?')){products=products.filter(p=>p.id!==id);persist();render();openManage()}}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
render();
</script>
</body></html>
