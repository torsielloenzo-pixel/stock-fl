<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><title>Stock FL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f4f6;--card:#fff;--text:#171717;--muted:#747474;--line:#e6e6e8}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;border:0;cursor:pointer}header{position:sticky;top:0;z-index:5;background:#f4f4f6ee;backdrop-filter:blur(14px);padding:calc(12px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line)}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.title{font-size:27px;font-weight:800}.small{font-size:12px;color:var(--muted);margin-top:4px}.manage,.primary{background:#111;color:#fff;border-radius:12px;padding:10px 13px;font-weight:700}.logout{background:#e8e8eb;border-radius:12px;padding:10px;font-weight:700}main{padding:14px 12px calc(30px + env(safe-area-inset-bottom));max-width:850px;margin:auto}.searchBox{position:relative;margin:0 0 14px}.searchBox input{padding-left:40px;background:#fff;box-shadow:0 1px 3px #00000010}.searchIcon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:17px;color:#777}.category{margin-bottom:12px;background:#fff;border-radius:17px;overflow:hidden;box-shadow:0 1px 3px #00000010}.catHeader{position:relative;display:flex;align-items:center;width:100%;min-height:72px;padding:14px 16px;overflow:hidden;text-align:left;color:#fff;background:#333}.catHeader:before,.catHeader:after{content:'';position:absolute;border-radius:999px;opacity:.22;pointer-events:none}.catHeader:before{width:150px;height:150px;right:-35px;top:-70px;background:#fff}.catHeader:after{width:100px;height:100px;right:70px;bottom:-75px;border:18px solid #fff;background:transparent}.catHeader>*{position:relative;z-index:1}.catHeader.fruits{background:linear-gradient(120deg,#c83c48,#e86b62)}.catHeader.legumes{background:linear-gradient(120deg,#347b55,#69a85f)}.catHeader.salades{background:linear-gradient(120deg,#668d3c,#9abf5b)}.catHeader.autres{background:linear-gradient(120deg,#65656d,#8b8b94)}.catHeader .catTitle{flex:1;margin:0;color:#fff;font-size:20px}.catHeader .small{color:#ffffffcc}.catHeader .dot{background:#fff!important;opacity:.9}.chevron{font-size:18px;color:#fff;transition:transform .18s}.category.collapsed .chevron{transform:rotate(-90deg)}.category.collapsed .grid{display:none}.category .grid{padding:0 9px 10px}.catTitle{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:800;margin:4px 2px 10px}.dot{width:11px;height:11px;border-radius:50%}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:#fff;border-radius:17px;padding:9px;box-shadow:0 1px 3px #00000012}.placeholder{width:100%;aspect-ratio:1.65/1;border-radius:12px;background:#ececef;display:grid;place-items:center;font-size:34px}.photo{width:100%;aspect-ratio:1.65/1;object-fit:cover;border-radius:12px}.name{font-weight:750;font-size:15px;margin:8px 2px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.packaging{font-size:12px;color:var(--muted);margin:0 2px 7px;font-weight:650}.cardHead{display:flex;align-items:center;gap:6px}.cardHead .name{flex:1}.infoBtn{width:28px;height:28px;border-radius:50%;background:#ededf0;font-weight:800;color:#555}.infoText{white-space:pre-wrap;line-height:1.45;background:#f5f5f7;padding:11px;border-radius:11px;min-height:45px}.counter{display:grid;grid-template-columns:42px 1fr 42px;gap:6px;align-items:center}.counter button{height:40px;border-radius:11px;background:#ededf0;font-size:24px;font-weight:600}.counter .plus{background:#111;color:#fff}.qty{text-align:center;font-size:20px;font-weight:800}.zero .qty{color:#d20b19}.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:55px;height:55px;border-radius:50%;background:#111;color:#fff;font-size:29px;box-shadow:0 6px 18px #0004}dialog{border:0;border-radius:20px;width:min(92vw,460px);padding:0;box-shadow:0 20px 60px #0005}dialog::backdrop{background:#0007}.modal{padding:18px}.modal h2{margin:0 0 15px}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--muted);font-weight:700;margin-bottom:6px}input,select{width:100%;padding:12px;border:1px solid #d7d7da;border-radius:11px;font:inherit;background:#fff}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:17px}.actions button{padding:11px 14px;border-radius:11px;font-weight:700}.secondary{background:#ededf0}.manageRow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.manageRow span{flex:1;font-weight:650}.moveBtns{display:flex;gap:4px}.move{background:#ededf0;width:34px;height:34px;border-radius:9px;font-weight:800}.move:disabled{opacity:.3}.delete{background:#ffe5e7;color:#b0000d;padding:8px 10px;border-radius:9px}.loginWrap{min-height:100vh;display:grid;place-items:center;padding:20px}.loginCard{width:min(100%,390px);background:#fff;padding:25px;border-radius:22px;box-shadow:0 10px 35px #0002}.loginCard h1{margin:0 0 5px}.loginCard .primary{width:100%;margin-top:8px;padding:13px}.error{color:#b0000d;font-size:13px;margin-top:10px}.loading{text-align:center;padding:50px;color:var(--muted)}.hidden{display:none!important}@media(max-width:350px){.grid{grid-template-columns:1fr}}

/* Refonte visuelle légère */
body{background:#f6f6f8}.title{font-size:25px;letter-spacing:-.5px}.top>div:last-child{display:flex;align-items:center;gap:7px}.manage{padding:9px 12px;background:#202024}.logout{width:39px;height:39px;padding:0}.searchBox{margin-top:2px;margin-bottom:16px}.searchBox input{height:48px;border:1px solid #e4e4e7;border-radius:15px;padding-left:42px;padding-right:38px;box-shadow:none;background:#fff}.clearSearch{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:29px;height:29px;border-radius:50%;background:#ececef;color:#666;font-size:16px}.category{box-shadow:none;border:1px solid #e8e8eb;border-radius:18px}.catHeader{min-height:66px}.card{position:relative;border:1px solid #ededf0;box-shadow:none;border-radius:16px;padding:8px}.photo,.placeholder{border-radius:11px}.cardHead{display:block}.name{font-size:15px;margin:9px 3px 2px;padding-right:0}.packaging{margin-left:3px}.infoBtn{position:absolute;right:14px;top:14px;z-index:2;width:30px;height:30px;background:#ffffffdd;box-shadow:0 1px 5px #0002;backdrop-filter:blur(5px)}.counter{display:grid;grid-template-columns:40px 1fr 40px;gap:0;background:#f0f0f2;border-radius:12px;overflow:hidden;margin-top:7px}.counter button{height:40px;border-radius:0;background:transparent;font-size:21px}.counter .plus{background:#202024}.qty{font-size:18px;display:grid;place-items:center}.zero{opacity:.78}.zero .photo,.zero .placeholder{filter:saturate(.65)}.stockState{font-size:11px;font-weight:750;color:#c20b18;margin:0 3px 5px}.fab{background:#202024;box-shadow:0 5px 16px #0003}
</style></head><body>
<div id="login" class="loginWrap hidden"><form class="loginCard" onsubmit="login(event)"><h1>📦 Stock FL</h1><p class="small">Connexion réservée aux utilisateurs autorisés.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary">Se connecter</button><div id="loginError" class="error"></div></form></div>
<div id="site" class="hidden"><header><div class="top"><div><div class="title">Stock F&amp;L</div><div id="who" class="small">Chargement…</div></div><div><button id="manageBtn" class="manage" onclick="openManage()">⚙︎ Gérer</button> <button class="logout" onclick="logout()">↪</button></div></div></header><main><div class="searchBox"><span class="searchIcon">⌕</span><input id="searchInput" type="search" placeholder="Rechercher un produit…" autocomplete="off" oninput="setSearch(this.value)"><button id="clearSearch" class="clearSearch hidden" onclick="clearSearch()" aria-label="Effacer">×</button></div><div id="app"><div class="loading">Chargement du stock…</div></div></main><button id="fab" class="fab" onclick="openAdd()">+</button></div>
<dialog id="addDialog"><form class="modal" onsubmit="saveProduct(event)"><h2>Ajouter un produit</h2><div class="field"><label>Nom</label><input id="pName" required></div><div class="field"><label>Catégorie</label><select id="pCat"><option>Fruits</option><option>Légumes</option><option>Salades</option><option>Autres</option></select></div><div class="field"><label>Conditionnement</label><select id="pPackaging"><option>Vrac</option><option>Filet</option><option>Barquette</option></select></div><div class="field"><label>Quantité</label><input id="pQty" type="number" min="0" step=".5" value="0"></div><div class="field"><label>Photo (optionnel)</label><input id="pPhoto" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif"></div><div class="actions"><button type="button" class="secondary" onclick="addDialog.close()">Annuler</button><button class="primary">Ajouter</button></div></form></dialog>
<dialog id="infoDialog"><form class="modal" onsubmit="saveInfo(event)"><h2>Fiche article</h2><input id="infoId" type="hidden"><div class="field"><label>Nom</label><input id="infoName" required></div><div class="field"><label>Catégorie</label><select id="infoCat"><option>Fruits</option><option>Légumes</option><option>Salades</option><option>Autres</option></select></div><div class="field"><label>Conditionnement</label><select id="infoPackaging"><option value="">Non renseigné</option><option>Vrac</option><option>Filet</option><option>Barquette</option></select></div><div class="field"><label>Photo du produit</label><input id="infoPhoto" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif"><div id="infoPhotoStatus" class="small"></div></div><div class="field"><label>Origine</label><input id="infoOrigin" placeholder="Ex. France"></div><div class="field"><label>Calibre</label><input id="infoCaliber" placeholder="Ex. 70/75"></div><div class="field"><label>Code article / EAN</label><input id="infoCode"></div><div class="field"><label>Informations / notes</label><textarea id="infoNotes" rows="5" style="width:100%;padding:12px;border:1px solid #d7d7da;border-radius:11px;font:inherit;resize:vertical"></textarea></div><div class="actions"><button type="button" class="secondary" onclick="infoDialog.close()">Fermer</button><button id="saveInfoBtn" class="primary">Enregistrer</button></div></form></dialog>
<dialog id="manageDialog"><div class="modal"><h2>Gérer les produits</h2><div id="manageList"></div><div class="actions"><button class="primary" onclick="manageDialog.close()">Terminé</button></div></div></dialog>
<script>
const SUPABASE_URL='https://gioxrpaiwogqqtakjpnv.supabase.co', SUPABASE_KEY='sb_publishable_nJPMS-Z_20ng1aMJmufbmg_gWFFndrC';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY); let searchTerm=''; const collapsed={Fruits:false,'Légumes':false,Salades:false,Autres:false}; const meta={'Fruits':{color:'#e1252d',emoji:'🍎'},'Légumes':{color:'#31a354',emoji:'🥬'},'Salades':{color:'#79b943',emoji:'🥗'},'Autres':{color:'#777',emoji:'📦'}}; let products=[],profile=null;
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])), fmt=n=>Number(n)%1?String(Number(n)).replace('.',','):String(Number(n));
async function boot(){const {data:{session}}=await db.auth.getSession(); if(!session)return showLogin(); const {data,error}=await db.from('profiles').select('display_name,email,role').eq('id',session.user.id).single(); if(error||!data){await db.auth.signOut();return showLogin('Compte non autorisé.')} profile=data;$('login').classList.add('hidden');$('site').classList.remove('hidden');$('who').textContent=(profile.display_name||profile.email)+' • '+profile.role;const manager=['admin','responsable'].includes(profile.role);$('manageBtn').classList.toggle('hidden',!manager);$('fab').classList.toggle('hidden',!manager);await loadProducts()}
function showLogin(msg=''){$('site').classList.add('hidden');$('login').classList.remove('hidden');$('loginError').textContent=msg}
async function login(e){e.preventDefault();$('loginError').textContent='';const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return $('loginError').textContent='Email ou mot de passe incorrect.';boot()}
async function logout(){await db.auth.signOut();showLogin()}
async function loadProducts(){const {data,error}=await db.from('products').select('*').eq('active',true).order('position').order('name');if(error)return $('app').innerHTML='<div class="error">Impossible de charger le stock.</div>';products=data||[];render()}
function setSearch(v){searchTerm=v.trim().toLocaleLowerCase('fr');$('clearSearch').classList.toggle('hidden',!searchTerm);render()} function clearSearch(){$('searchInput').value='';setSearch('');$('searchInput').focus()}
function toggleCategory(cat){collapsed[cat]=!collapsed[cat];render()}
function render(){const app=$('app');app.innerHTML='';let shown=0;Object.keys(meta).forEach(cat=>{const all=products.filter(p=>p.category===cat);const items=searchTerm?all.filter(p=>[p.name,p.packaging,p.origin,p.caliber,p.article_code,p.notes].some(v=>String(v||'').toLocaleLowerCase('fr').includes(searchTerm))):all;if(searchTerm&&!items.length)return;shown+=items.length;const s=document.createElement('section');s.className='category'+(!searchTerm&&collapsed[cat]?' collapsed':'');s.innerHTML='<button class="catHeader '+(cat==='Fruits'?'fruits':cat==='Légumes'?'legumes':cat==='Salades'?'salades':'autres')+'" onclick="toggleCategory(\''+cat.replace(/'/g,"\\'")+'\')"><div class="catTitle"><span class="dot" style="background:'+meta[cat].color+'"></span>'+esc(cat)+' <span class="small">('+items.length+')</span></div><span class="chevron">⌄</span></button><div class="grid"></div>';const g=s.querySelector('.grid');items.forEach(p=>{const c=document.createElement('div');c.className='card'+(Number(p.quantity)===0?' zero':'');const visual=p.photo_url?'<img class="photo" src="'+esc(p.photo_url)+'" alt="">':'<div class="placeholder">'+(meta[p.category]?.emoji||'📦')+'</div>';const canEdit=profile.role!=='lecture';c.innerHTML=visual+'<div class="cardHead"><div class="name">'+esc(p.name)+'</div><button class="infoBtn" onclick="openInfo(\''+p.id+'\')">i</button></div>'+(p.packaging?'<div class="packaging">'+esc(p.packaging)+'</div>':'')+(Number(p.quantity)===0?'<div class="stockState">Rupture</div>':'')+'<div class="counter"><button '+(!canEdit?'disabled':'')+' onclick="change(\''+p.id+'\',-.5)">−</button><div class="qty">'+fmt(p.quantity)+'</div><button class="plus" '+(!canEdit?'disabled':'')+' onclick="change(\''+p.id+'\',.5)">+</button></div>';g.appendChild(c)});app.appendChild(s)});if(searchTerm&&!shown)app.innerHTML='<div class="loading">Aucun produit trouvé.</div>'}
async function change(id,d){if(profile.role==='lecture')return;const p=products.find(x=>x.id===id),q=Math.max(0,Math.round((Number(p.quantity)+d)*2)/2),old=p.quantity;p.quantity=q;render();const {error}=await db.from('products').update({quantity:q}).eq('id',id);if(error){p.quantity=old;render();alert('Modification refusée.')} }
function openInfo(id){const p=products.find(x=>x.id===id);if(!p)return;$('infoId').value=p.id;$('infoName').value=p.name||'';$('infoCat').value=p.category||'Autres';$('infoPackaging').value=p.packaging||'';$('infoOrigin').value=p.origin||'';$('infoCaliber').value=p.caliber||'';$('infoCode').value=p.article_code||'';$('infoNotes').value=p.notes||'';$('infoPhoto').value='';$('infoPhotoStatus').textContent=p.photo_url?'Photo actuelle enregistrée':'Aucune photo';const canManage=['admin','responsable'].includes(profile.role);['infoName','infoCat','infoPackaging','infoPhoto','infoOrigin','infoCaliber','infoCode','infoNotes'].forEach(id=>$ (id).disabled=!canManage);$('saveInfoBtn').classList.toggle('hidden',!canManage);$('infoDialog').showModal()}
async function saveInfo(e){e.preventDefault();if(!['admin','responsable'].includes(profile.role))return;const id=$('infoId').value,btn=$('saveInfoBtn');btn.disabled=true;btn.textContent='Enregistrement…';try{const current=products.find(x=>x.id===id);let photoUrl=current?.photo_url||null;const file=$('infoPhoto').files[0];if(file){const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path=crypto.randomUUID()+'.'+ext;const {error:upErr}=await db.storage.from('product-images').upload(path,file,{cacheControl:'3600',upsert:false});if(upErr)throw upErr;const {data:urlData}=db.storage.from('product-images').getPublicUrl(path);photoUrl=urlData.publicUrl}const changes={name:$('infoName').value.trim(),category:$('infoCat').value,packaging:$('infoPackaging').value||null,photo_url:photoUrl,origin:$('infoOrigin').value.trim()||null,caliber:$('infoCaliber').value.trim()||null,article_code:$('infoCode').value.trim()||null,notes:$('infoNotes').value.trim()||null};const {error}=await db.from('products').update(changes).eq('id',id);if(error)throw error;$('infoDialog').close();await loadProducts()}catch(err){alert('Modification impossible : '+err.message)}finally{btn.disabled=false;btn.textContent='Enregistrer'}}

function openAdd(){if(!['admin','responsable'].includes(profile.role))return;$('addDialog').showModal()}
async function saveProduct(e){
e.preventDefault();
const btn=e.submitter;if(btn){btn.disabled=true;btn.textContent='Ajout…'}
try{
 let photoUrl=null,file=$('pPhoto').files[0];
 if(file){
   const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
   const path=crypto.randomUUID()+'.'+ext;
   const {error:upErr}=await db.storage.from('product-images').upload(path,file,{cacheControl:'3600',upsert:false});
   if(upErr)throw upErr;
   const {data:urlData}=db.storage.from('product-images').getPublicUrl(path);
   photoUrl=urlData.publicUrl;
 }
 const max=products.reduce((m,p)=>Math.max(m,p.position||0),0);
 const {error}=await db.from('products').insert({name:$('pName').value.trim(),category:$('pCat').value,packaging:$('pPackaging').value,quantity:Math.max(0,Number($('pQty').value)||0),photo_url:photoUrl,position:max+1});
 if(error)throw error;
 e.target.reset();$('pQty').value=0;$('addDialog').close();await loadProducts();
}catch(err){alert('Ajout impossible : '+err.message)}
finally{if(btn){btn.disabled=false;btn.textContent='Ajouter'}}
}
function openManage(){if(!['admin','responsable'].includes(profile.role))return;renderManage();$('manageDialog').showModal()}
function renderManage(){const l=$('manageList');l.innerHTML='';Object.keys(meta).forEach(cat=>{const items=products.filter(p=>p.category===cat);if(!items.length)return;const h=document.createElement('div');h.className='catTitle';h.style.marginTop='14px';h.innerHTML='<span class="dot" style="background:'+meta[cat].color+'"></span>'+esc(cat);l.appendChild(h);items.forEach(p=>{const r=document.createElement('div');r.className='manageRow';r.draggable=true;r.dataset.id=p.id;r.dataset.cat=p.category;r.innerHTML='<span class="dragHandle">☰</span><span>'+esc(p.name)+(p.packaging?' <small>• '+esc(p.packaging)+'</small>':'')+'</span><button class="delete" onclick="event.stopPropagation();removeProduct(\''+p.id+'\')">Supprimer</button>';r.addEventListener('dragstart',e=>{r.classList.add('dragging');e.dataTransfer.setData('text/plain',p.id);e.dataTransfer.effectAllowed='move'});r.addEventListener('dragend',()=>{r.classList.remove('dragging');document.querySelectorAll('.dragOver').forEach(x=>x.classList.remove('dragOver'))});r.addEventListener('dragover',e=>{if(document.querySelector('.dragging')?.dataset.cat!==p.category)return;e.preventDefault();r.classList.add('dragOver')});r.addEventListener('dragleave',()=>r.classList.remove('dragOver'));r.addEventListener('drop',async e=>{e.preventDefault();r.classList.remove('dragOver');const from=e.dataTransfer.getData('text/plain');if(from&&from!==p.id)await reorderProduct(from,p.id)});l.appendChild(r)})})}
async function reorderProduct(fromId,toId){const from=products.find(p=>p.id===fromId),to=products.find(p=>p.id===toId);if(!from||!to||from.category!==to.category)return;const catItems=products.filter(p=>p.category===from.category).sort((a,b)=>(Number(a.position)||0)-(Number(b.position)||0));const a=catItems.findIndex(p=>p.id===fromId),b=catItems.findIndex(p=>p.id===toId);if(a<0||b<0)return;const [moved]=catItems.splice(a,1);catItems.splice(b,0,moved);const other=products.filter(p=>p.category!==from.category);products=[...other,...catItems].sort((x,y)=>(Number(x.position)||0)-(Number(y.position)||0));catItems.forEach((p,i)=>p.position=i+1);render();renderManage();const results=await Promise.all(catItems.map((p,i)=>db.from('products').update({position:i+1}).eq('id',p.id)));if(results.some(x=>x.error)){alert('Impossible d’enregistrer le nouvel ordre.');await loadProducts();renderManage();return}await loadProducts();renderManage()}

async function removeProduct(id){if(!confirm('Supprimer ce produit ?'))return;const {error}=await db.from('products').delete().eq('id',id);if(error)return alert('Suppression impossible.');await loadProducts();renderManage()}
db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT')showLogin()});boot();
</script></body></html>
