<style>

main{width:min(94vw,1040px);padding:58px 0 70px}
.hello{margin-bottom:24px}.hello h1{font-size:36px}
.pages{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pageCard{min-height:280px;padding:0;border-radius:20px;border:1px solid #dedee2;background:#fff;display:flex;flex-direction:column;text-align:left;box-shadow:0 7px 24px #00000008;overflow:hidden;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.pageCard:before{display:none}.pageCard:hover{transform:translateY(-3px);box-shadow:0 16px 38px #00000012;border-color:#cfcfd2}
.pageCard:after{content:"";height:4px;position:absolute;left:0;right:0;top:0;background:#ececee}
.pageCard.stock:after{background:linear-gradient(90deg,var(--red) 0 72%,var(--black) 72%)}

.cardTop{display:flex;align-items:center;justify-content:space-between;padding:22px 22px 0}.cardKicker{font-size:9px;font-weight:900;letter-spacing:.9px;color:#9a9a9e}
.icon{width:48px;height:48px;border-radius:13px;margin:0;font-size:21px}
.stock .icon{background:#171717;color:#fff;box-shadow:inset 0 -4px 0 var(--red)}
.planning .icon{background:#f2f2f3;color:#171717;border:1px solid #e1e1e3}
.chatCard .icon{background:#fff2f3;color:#b90710;border:1px solid #f2d7d9}
.cardContent{padding:26px 22px 18px;flex:1}.pageCard h2{font-size:24px;margin:0 0 9px;letter-spacing:-.55px}.pageCard p{font-size:12px;line-height:1.55;color:#747478;max-width:none}
.cardFoot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #eeeeef;padding:14px 18px 14px 22px;font-size:10px;font-weight:800;color:#69696e}
.arrow{position:static;width:32px;height:32px;font-size:15px;background:#f0f0f2;color:#171717}.stock .arrow{background:var(--red);color:#fff}.chatCard .arrow{background:#171717;color:#fff}
.status{margin-top:14px;padding-left:2px}
@media(max-width:900px){.pages{grid-template-columns:1fr 1fr}.pageCard{min-height:245px}}

<body>
<header><div class="top"><div class="brand"><div class="nMenuWrap"><button class="mark nMenuBtn" onclick="toggleNMenu(event)" aria-label="Menu">N</button><div id="nMenu" class="nMenu hidden"><div class="nMenuTitle">Navigation</div><button onclick="location.href='home.html'"><span>⌂</span><div><strong>Accueil</strong><small>Choisir un outil</small></div></button><button onclick="location.href='index.html'"><span>☷</span><div><strong>Stock F&amp;L</strong><small>Gestion du stock</small></div></button><button onclick="location.href='planning.html'"><span>▦</span><div><strong>Planning</strong><small>Horaires de l'équipe</small></div></button><button onclick="location.href='chat.html'"><span>◉</span><div><strong>Équipe</strong><small>Messagerie interne</small></div></button><button class="adminOnlyMenu hidden" onclick="location.href='stock-test.html'"><span>▦</span><div><strong>Vue test</strong><small>Stock groupé par familles</small></div></button><button class="adminOnlyMenu hidden" onclick="location.href='index.html?admin=accounts'"><span>♙</span><div><strong>Comptes</strong><small>Utilisateurs et rôles</small></div></button><button class="adminOnlyMenu hidden" onclick="location.href='settings.html'"><span>⚙</span><div><strong>Personnalisation</strong><small>Réglages du portail</small></div></button><button class="logoutItem" onclick="menuLogout()"><span>↪</span><div><strong>Déconnexion</strong><small>Quitter la session</small></div></button></div></div><div><strong>Netto</strong><small>Espace outils</small></div></div><div class="userMenuWrap"><button id="userMenuBtn" class="userPill" onclick="toggleUserMenu(event)" aria-expanded="false"><span id="userAvatar" class="userAvatar">U</span><span class="userText"><strong id="userName">Utilisateur</strong><small id="userRole">Compte</small></span><span class="userChevron">⌄</span></button><div id="userMenu" class="userMenu hidden"><div class="userMenuHead"><span id="userMenuAvatar" class="userAvatar">U</span><div><strong id="userMenuName">Utilisateur</strong><small id="userMenuRole">Compte</small></div></div><button onclick="location.href='home.html'"><span>⌂</span><div><strong>Accueil</strong><small>Retour au portail</small></div></button><button class="adminOnlyMenu hidden" onclick="location.href='settings.html'"><span>⚙</span><div><strong>Personnalisation</strong><small>Réglages du portail</small></div></button><button class="userLogout" onclick="menuLogout()"><span>↪</span><div><strong>Déconnexion</strong><small>Quitter la session</small></div></button></div></div></div></header>
<main>
 <div class="hello"><div class="eyebrow">Espace de travail</div><h1 id="helloTitle">Bonjour 👋</h1><p>Choisis l’espace que tu veux ouvrir.</p></div>
 <div class="pages">
  <button class="pageCard stock" onclick="location.href='index.html'"><div class="cardTop"><div class="icon">N</div><span class="cardKicker">GESTION</span></div><div class="cardContent"><h2>Stock F&amp;L</h2><p>Gérer les quantités, les fiches articles, les suggestions de commande et le panier.</p></div><div class="cardFoot"><span>Ouvrir l’outil</span><span class="arrow">→</span></div></button>
  <button class="pageCard planning" onclick="location.href='planning.html'"><div class="cardTop"><div class="icon">▦</div><span class="cardKicker">ORGANISATION</span></div><div class="cardContent"><h2>Planning</h2><p>Consulter les horaires de l’équipe et passer en mode modification lorsque nécessaire.</p></div><div class="cardFoot"><span>Voir le planning</span><span class="arrow">→</span></div></button>
  <button class="pageCard chatCard" onclick="location.href='chat.html'"><div class="cardTop"><div class="icon">◉</div><span class="cardKicker">ÉQUIPE</span></div><div class="cardContent"><h2>Équipe</h2><p>Échanger avec l’équipe, partager des photos, vidéos et documents utiles au quotidien.</p></div><div class="cardFoot"><span>Ouvrir le chat</span><span class="arrow">→</span></div></button>
 </div>
 <div id="status" class="status">Vérification de la session…</div>
</main>
<script>
const SUPABASE_URL='https://gioxrpaiwogqqtakjpnv.supabase.co',SUPABASE_KEY='sb_publishable_nJPMS-Z_20ng1aMJmufbmg_gWFFndrC';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let audioCtx=null;
function logoutSound(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const a=audioCtx||(audioCtx=new A()),play=()=>{const n=a.currentTime,m=a.createGain();m.gain.setValueAtTime(.0001,n);m.gain.exponentialRampToValueAtTime(.045,n+.04);m.gain.exponentialRampToValueAtTime(.0001,n+.5);m.connect(a.destination);[[587,0],[494,.08],[392,.16]].forEach(([f,d])=>{const o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(f,n+d);g.gain.setValueAtTime(.0001,n+d);g.gain.exponentialRampToValueAtTime(.22,n+d+.035);g.gain.exponentialRampToValueAtTime(.0001,n+d+.3);o.connect(g);g.connect(m);o.start(n+d);o.stop(n+d+.33)})};a.state==='suspended'?a.resume().then(play):play()}catch(e){}}
function toggleUserMenu(e){e?.stopPropagation();const m=document.getElementById('userMenu'),b=document.getElementById('userMenuBtn');m.classList.toggle('hidden');b.setAttribute('aria-expanded',String(!m.classList.contains('hidden')))}
function closeUserMenu(){const m=document.getElementById('userMenu');if(m)m.classList.add('hidden');const b=document.getElementById('userMenuBtn');if(b)b.setAttribute('aria-expanded','false')}
document.addEventListener('click',e=>{if(!e.target.closest('.userMenuWrap'))closeUserMenu()});
async function boot(){const {data:{session}}=await db.auth.getSession();if(!session){location.replace('index.html');return}const {data:p}=await db.from('profiles').select('display_name,email,role').eq('id',session.user.id).maybeSingle();window.currentRole=p?.role;document.querySelectorAll('.adminOnlyMenu').forEach(x=>x.classList.toggle('hidden',window.currentRole!=='admin'));const name=p?.display_name||p?.email?.split('@')[0]||'';const roleNames={admin:'Administrateur',responsable:'Responsable',lecture:'Lecture seule',employe:'Employé'},role=roleNames[p?.role]||p?.role||'Compte';document.getElementById('helloTitle').textContent=name?'Bonjour '+name+' 👋':'Bonjour 👋';const ini=(name||'U').trim().split(/\s+/).slice(0,2).map(x=>x[0]?.toUpperCase()).join('');['userAvatar','userMenuAvatar'].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent=ini});['userName','userMenuName'].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent=name||'Utilisateur'});['userRole','userMenuRole'].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent=role});await loadSharedSiteConfig();document.getElementById('status').textContent='Session active'}
async function logout(){logoutSound();await new Promise(r=>setTimeout(r,380));await db.auth.signOut();location.replace('index.html')} async function menuLogout(){await logout()}
boot();

async function loadSharedSiteConfig(){
 try{
  if(!db)return null;
  const {data}=await db.from('app_settings').select('value').eq('key','site_config').maybeSingle();
  const cfg=data?.value;if(!cfg)return null;
  applySharedSiteConfig(cfg);return cfg;
 }catch(e){console.warn('Réglages du site:',e);return null}
}
function setMenuEntry(urlKey,cfg){
 const n=cfg?.nav?.[urlKey];if(!n)return;
 const defaults={home:'home.html',stock:'index.html',planning:'planning.html',chat:'chat.html',test:'stock-test.html'};
 const old=defaults[urlKey];
 document.querySelectorAll('#nMenu button,#brandMenu button').forEach(b=>{
  const oc=b.getAttribute('onclick')||'';
  if(!oc.includes("'"+old+"'")&&!oc.includes('"'+old+'"'))return;
  const icon=b.querySelector(':scope > span'),strong=b.querySelector('strong'),small=b.querySelector('small');
  if(icon)icon.textContent=n.icon||icon.textContent;if(strong)strong.textContent=n.label||strong.textContent;if(small)small.textContent=n.subtitle||'';
  const target=String(n.url||old).replace(/['"<>]/g,'');b.onclick=()=>location.href=target;
 });
}

function applySharedSiteConfig(cfg){
 ['home','stock','planning','chat','test'].forEach(k=>setMenuEntry(k,cfg));
 const brand=cfg?.brand;if(brand){const b=document.querySelector('.brand>div:last-child strong'),s=document.querySelector('.brand>div:last-child small');if(b&&brand.name)b.textContent=brand.name;if(s&&brand.subtitle)s.textContent=brand.subtitle}
 const eyebrow=document.querySelector('.eyebrow'),intro=document.querySelector('.hello p');if(eyebrow&&cfg?.home?.eyebrow)eyebrow.textContent=cfg.home.eyebrow;if(intro&&cfg?.home?.intro)intro.textContent=cfg.home.intro;
 const map={stock:document.querySelector('.pageCard.stock'),planning:document.querySelector('.pageCard.planning'),chat:document.querySelector('.pageCard.chatCard')};
 Object.entries(map).forEach(([k,el])=>{const p=cfg?.pages?.[k];if(!el||!p)return;el.classList.toggle('hidden',p.visible===false);el.style.order=Number(p.order||1);const ic=el.querySelector('.icon'),h2=el.querySelector('h2'),d=el.querySelector('p');if(ic)ic.textContent=p.icon||'';if(h2)h2.textContent=p.label||'';if(d)d.textContent=p.description||'';const target=String(p.url||'').replace(/['"<>]/g,'');el.onclick=()=>location.href=target});
 document.querySelectorAll('.settingsLink').forEach(x=>x.classList.toggle('hidden',window.currentRole!=='admin'));
}

</script>
