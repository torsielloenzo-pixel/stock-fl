<script>
const SUPABASE_URL='https://gioxrpaiwogqqtakjpnv.supabase.co',SUPABASE_KEY='sb_publishable_nJPMS-Z_20ng1aMJmufbmg_gWFFndrC';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let session=null,profile=null,messages=[],selectedFile=null,channel=null,presenceChannel=null,members=[],onlineIds=new Set();
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toggleMenu(e){e?.stopPropagation();$('nMenu').classList.toggle('hidden')}function closeMenu(){$('nMenu').classList.add('hidden')}
document.addEventListener('click',e=>{if(!e.target.closest('.nMenuWrap'))closeMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();if(!$('imageLightbox').classList.contains('hidden'))closeImageLightbox({target:$('imageLightbox')})}});
function initials(n){return String(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]?.toUpperCase()).join('')}
function renderMembers(){const box=$('members');if(!box)return;if(!members.length){box.innerHTML='<div class="empty">Aucun membre.</div>';return}const roleNames={admin:'Administrateur',responsable:'Responsable',lecture:'Lecture seule',employe:'Employé'};box.innerHTML=[...members].sort((a,b)=>(onlineIds.has(b.id)-onlineIds.has(a.id))||(a.display_name||a.email||'').localeCompare(b.display_name||b.email||'','fr')).map(m=>{const online=onlineIds.has(m.id),name=m.display_name||m.email?.split('@')[0]||'Utilisateur',me=m.id===session?.user?.id;return '<div class="member"><div class="memberAvatar">'+esc(initials(name))+'</div><div class="memberInfo"><strong>'+esc(name)+(me?'<span class="youTag">TOI</span>':'')+'</strong><small>'+esc(roleNames[m.role]||m.role||'Utilisateur')+'</small></div><i class="onlineDot '+(online?'on':'')+'" title="'+(online?'En ligne':'Hors ligne')+'"></i></div>'}).join('')}
async function loadMembers(){const {data,error}=await db.from('profiles').select('id,display_name,email,role').order('display_name');if(error){$('members').innerHTML='<div class="empty">Impossible de charger les membres.</div>';return}members=data||[];renderMembers()}
function syncPresence(){if(!presenceChannel)return;const state=presenceChannel.presenceState(),ids=new Set();Object.values(state).flat().forEach(x=>{if(x?.user_id)ids.add(x.user_id)});onlineIds=ids;renderMembers()}
function startPresence(){presenceChannel=db.channel('team-presence',{config:{presence:{key:session.user.id}}}).on('presence',{event:'sync'},syncPresence).on('presence',{event:'join'},syncPresence).on('presence',{event:'leave'},syncPresence).subscribe(async status=>{if(status==='SUBSCRIBED'){await presenceChannel.track({user_id:session.user.id,display_name:profile.display_name||profile.email||'Utilisateur',online_at:new Date().toISOString()});syncPresence()}})}
function openImageLightbox(url){$('lightboxImage').src=url;$('imageLightbox').classList.remove('hidden');document.body.style.overflow='hidden'}
function closeImageLightbox(e){if(e&&e.target!==$('imageLightbox')&&!e.target.classList.contains('lightboxClose'))return;$('imageLightbox').classList.add('hidden');$('lightboxImage').src='';document.body.style.overflow=''}

function dayLabel(v){const d=new Date(v),now=new Date(),y=new Date(now);y.setDate(now.getDate()-1);if(d.toDateString()===now.toDateString())return "Aujourd’hui";if(d.toDateString()===y.toDateString())return "Hier";return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
function timeLabel(v){return new Date(v).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
function sizeLabel(n){n=Number(n)||0;if(n<1024)return n+' o';if(n<1048576)return (n/1024).toFixed(1).replace('.',',')+' Ko';return (n/1048576).toFixed(1).replace('.',',')+' Mo'}
async function signed(path){if(!path)return null;const {data}=await db.storage.from('chat-files').createSignedUrl(path,3600);return data?.signedUrl||null}
async function renderMessages(){const box=$('messages');if(!messages.length){box.innerHTML='<div class="empty">Aucun message pour le moment.<br>Tu peux lancer la conversation.</div>';return}let html='',lastDay='';for(const m of messages){const day=dayLabel(m.created_at);if(day!==lastDay){html+='<div class="daySep">'+esc(day)+'</div>';lastDay=day}const mine=m.user_id===session?.user?.id;let attachment='';if(m.attachment_path){const url=await signed(m.attachment_path);if(url){const type=m.attachment_type||'';if(type.startsWith('image/'))attachment='<div class="attachment"><img src="'+esc(url)+'" alt="" onclick="openImageLightbox(this.src)" title="Cliquer pour agrandir"><div class="fileRow"><div class="fileInfo"><strong>'+esc(m.attachment_name||'Image')+'</strong><small>'+sizeLabel(m.attachment_size)+'</small></div><a class="download" href="'+esc(url)+'" target="_blank" rel="noopener">Télécharger</a></div></div>';else if(type.startsWith('video/'))attachment='<div class="attachment"><video controls preload="metadata" src="'+esc(url)+'"></video><div class="fileRow"><div class="fileInfo"><strong>'+esc(m.attachment_name||'Vidéo')+'</strong><small>'+sizeLabel(m.attachment_size)+'</small></div><a class="download" href="'+esc(url)+'" target="_blank" rel="noopener">Télécharger</a></div></div>';else attachment='<div class="attachment"><div class="fileRow"><div class="fileIcon">📎</div><div class="fileInfo"><strong>'+esc(m.attachment_name||'Pièce jointe')+'</strong><small>'+sizeLabel(m.attachment_size)+'</small></div><a class="download" href="'+esc(url)+'" target="_blank" rel="noopener">Télécharger</a></div></div>'}}html+='<article class="msg '+(mine?'mine':'')+'"><div class="avatar">'+esc(initials(m.display_name))+'</div><div class="bubble"><div class="msgTop"><strong>'+esc(m.display_name||'Utilisateur')+'</strong><time>'+esc(timeLabel(m.created_at))+'</time></div>'+(m.body?'<div class="body">'+esc(m.body)+'</div>':'')+attachment+'</div>'+(profile?.role==='admin'?'<button class="deleteMsg" onclick="deleteMessage('+m.id+')" title="Supprimer">×</button>':'')+'</article>'}box.innerHTML=html;box.scrollTop=box.scrollHeight}
async function loadMessages(){const {data,error}=await db.from('chat_messages').select('*').order('created_at',{ascending:true}).limit(300);if(error){$('messages').innerHTML='<div class="empty"><strong>Chat indisponible.</strong><br>La base de données du chat doit être initialisée.</div>';return}messages=data||[];await renderMessages()}
function selectAttachment(input){const f=input.files?.[0];if(!f)return;if(f.size>25*1024*1024){alert('Pièce jointe trop lourde : 25 Mo maximum.');input.value='';return}selectedFile=f;$('attachName').textContent=f.name+' • '+sizeLabel(f.size);$('attachPreview').classList.add('show')}
function clearAttachment(){selectedFile=null;$('file').value='';$('attachPreview').classList.remove('show')}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}}
async function sendMessage(){const body=$('message').value.trim();if(!body&&!selectedFile)return;const btn=$('send');btn.disabled=true;try{let path=null,name=null,type=null,size=null;if(selectedFile){const ext=(selectedFile.name.split('.').pop()||'bin').replace(/[^a-z0-9]/gi,'').toLowerCase();path=session.user.id+'/'+Date.now()+'-'+crypto.randomUUID()+'.'+ext;const {error:up}=await db.storage.from('chat-files').upload(path,selectedFile,{upsert:false});if(up)throw up;name=selectedFile.name;type=selectedFile.type||'application/octet-stream';size=selectedFile.size}const {error}=await db.from('chat_messages').insert({user_id:session.user.id,display_name:profile.display_name||profile.email?.split('@')[0]||'Utilisateur',body:body||null,attachment_path:path,attachment_name:name,attachment_type:type,attachment_size:size});if(error){if(path)await db.storage.from('chat-files').remove([path]);throw error}$('message').value='';clearAttachment();await loadMessages()}catch(e){alert('Envoi impossible : '+e.message)}finally{btn.disabled=false}}
async function deleteMessage(id){if(profile?.role!=='admin')return;const m=messages.find(x=>x.id===id);if(!confirm('Supprimer ce message ?'))return;if(m?.attachment_path)await db.storage.from('chat-files').remove([m.attachment_path]);const {error}=await db.from('chat_messages').delete().eq('id',id);if(error)return alert('Suppression impossible : '+error.message);await loadMessages()}
async function resetChat(){if(profile?.role!=='admin')return;if(!confirm('Réinitialiser toute la conversation ? Cette action supprime aussi les pièces jointes.'))return;const paths=messages.map(m=>m.attachment_path).filter(Boolean);if(paths.length)await db.storage.from('chat-files').remove(paths);const {error}=await db.from('chat_messages').delete().gt('id',0);if(error)return alert('Réinitialisation impossible : '+error.message);await loadMessages()}
async function logout(){closeMenu();await db.auth.signOut();location.href='index.html'} async function menuLogout(){await logout()}
async function boot(){const {data:{session:s}}=await db.auth.getSession();session=s;if(!session){location.replace('index.html');return}const {data:p,error}=await db.from('profiles').select('display_name,email,role').eq('id',session.user.id).maybeSingle();if(error||!p){location.replace('index.html');return}profile=p;window.currentRole=p.role;document.querySelectorAll('.adminOnlyMenu').forEach(x=>x.classList.toggle('hidden',window.currentRole!=='admin'));await loadSharedSiteConfig();$('adminBox').classList.toggle('hidden',p.role!=='admin');await loadMembers();startPresence();await loadMessages();channel=db.channel('chat-general').on('postgres_changes',{event:'*',schema:'public',table:'chat_messages'},()=>loadMessages()).subscribe();setInterval(loadMessages,15000)}
boot();

async function loadSharedSiteConfig(){
 try{
  if(!db)return null;
  const {data}=await db.from('app_settings').select('value').eq('key','site_config').maybeSingle();
  const cfg=data?.value;if(!cfg)return null;
  applySharedSiteConfig(cfg);return cfg;
 }catch(e){console.warn('Réglages du site:',e);return null}
}
function setMenuEntry(urlKey,cfg){
 const n=cfg?.nav?.[urlKey];if(!n)return;
 const defaults={home:'home.html',stock:'index.html',planning:'planning.html',chat:'chat.html',test:'stock-test.html'};
 const old=defaults[urlKey];
 document.querySelectorAll('#nMenu button,#brandMenu button').forEach(b=>{
  const oc=b.getAttribute('onclick')||'';
  if(!oc.includes("'"+old+"'")&&!oc.includes('"'+old+'"'))return;
  const icon=b.querySelector(':scope > span'),strong=b.querySelector('strong'),small=b.querySelector('small');
  if(icon)icon.textContent=n.icon||icon.textContent;if(strong)strong.textContent=n.label||strong.textContent;if(small)small.textContent=n.subtitle||'';
  const target=String(n.url||old).replace(/['"<>]/g,'');b.onclick=()=>location.href=target;
 });
}
function applySharedSiteConfig(cfg){
 ['home','stock','planning','chat','test'].forEach(k=>setMenuEntry(k,cfg));
 const pt=cfg?.pageTitles?.['chat'];
 if(pt){const t=document.querySelector('header .title');const s=document.querySelector('header .subtitle,header .sub');if(t&&pt.title)t.textContent=pt.title;if(s&&pt.subtitle)s.textContent=pt.subtitle}
 const settings=document.querySelectorAll('.settingsLink');settings.forEach(x=>x.classList.toggle('hidden',!(window.currentRole==='admin'||window.planningCanEdit||profile?.role==='admin')));
}


function currentTheme(){return document.documentElement.dataset.theme==='dark'?'dark':'light'}
function applyTheme(theme){theme=theme==='dark'?'dark':'light';document.documentElement.dataset.theme=theme;try{localStorage.setItem('nettoTheme',theme)}catch(e){}document.querySelectorAll('.themeIcon').forEach(x=>x.textContent=theme==='dark'?'☀':'☾');document.querySelectorAll('.themeLabel').forEach(x=>x.textContent=theme==='dark'?'Mode clair':'Mode sombre');document.querySelectorAll('.themeSub').forEach(x=>x.textContent=theme==='dark'?'Revenir au thème clair':'Passer au thème sombre');const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=theme==='dark'?'#111214':'#f4f4f6'}
function toggleTheme(e){e?.stopPropagation();applyTheme(currentTheme()==='dark'?'light':'dark')}
document.addEventListener('DOMContentLoaded',()=>applyTheme(currentTheme()));
</script></body></html>
