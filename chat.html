<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171717">
<title>Netto — Équipe</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--red:#e30613;--red2:#b90710;--black:#171717;--line:#e2e2e5;--muted:#7b7b80;--bg:#f2f3f4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;height:100dvh;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:linear-gradient(135deg,#eef0f1,#fafafa 48%,#f0f1f2)}
button,input,textarea{font:inherit}button{cursor:pointer}
header{height:70px;background:#ffffffef;border-bottom:1px solid #ddd;box-shadow:0 4px 18px #00000008;display:flex;align-items:center;position:relative;z-index:20}
header:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--red) 0 43%,var(--black) 43% 49%,#fff 49%)}
.top{width:min(96vw,1120px);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.mark{width:40px;height:40px;border:0;border-radius:10px;background:#171717;color:#fff;display:grid;place-items:center;font-size:21px;font-weight:950;box-shadow:inset 0 -5px 0 var(--red),0 3px 10px #0002}.title{font-size:19px;font-weight:900}.sub{font-size:11px;color:#888;margin-top:2px}.back{border:1px solid #dedede;background:#fff;border-radius:11px;padding:9px 12px;font-weight:780}
.wrap{width:min(96vw,1120px);height:calc(100dvh - 70px);margin:auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;padding:14px 0}
.side,.chat{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 26px #00000008;overflow:hidden}.side{padding:18px;display:flex;flex-direction:column}.side h2{margin:0 0 4px;font-size:20px}.side p{margin:0;color:#888;font-size:11px;line-height:1.4}.me{margin-top:20px;padding:12px;background:#f7f7f8;border-radius:13px}.me strong{display:block;font-size:13px}.me small{display:block;color:#888;font-size:10px;margin-top:2px}.tips{margin-top:auto;font-size:10px;color:#999;line-height:1.5}.adminBox{margin-top:12px;padding-top:12px;border-top:1px solid #eee}.adminReset{width:100%;border:1px solid #ffd4d7;background:#fff5f6;color:#a30d15;border-radius:10px;padding:9px;font-weight:800;font-size:11px}
.chat{display:grid;grid-template-rows:auto minmax(0,1fr) auto}.chatHead{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid #eee}.chatHead strong{font-size:15px}.live{font-size:10px;color:#6a6a6f;display:flex;align-items:center;gap:5px}.live i{width:7px;height:7px;border-radius:50%;background:#2ba84a;box-shadow:0 0 0 3px #2ba84a18}.messages{overflow-y:auto;padding:17px 18px 24px;scroll-behavior:smooth}.daySep{display:flex;align-items:center;gap:9px;color:#999;font-size:10px;font-weight:750;margin:16px 0}.daySep:before,.daySep:after{content:"";height:1px;background:#ececef;flex:1}.msg{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:9px;margin:11px 0;align-items:start}.avatar{width:36px;height:36px;border-radius:11px;background:#1c1c1f;color:#fff;display:grid;place-items:center;font-weight:900;font-size:12px;box-shadow:inset 0 -3px 0 var(--red)}.bubble{min-width:0;background:#f6f6f7;border:1px solid #ebebed;border-radius:6px 15px 15px 15px;padding:9px 11px}.mine .bubble{background:#fff7f7;border-color:#f2d9db}.msgTop{display:flex;align-items:center;gap:7px;margin-bottom:3px}.msgTop strong{font-size:12px}.msgTop time{font-size:9px;color:#999}.body{font-size:13px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.attachment{margin-top:8px;border:1px solid #e3e3e6;border-radius:11px;overflow:hidden;background:#fff}.attachment img,.attachment video{display:block;width:min(100%,460px);max-height:310px;object-fit:contain;background:#111}.fileRow{display:flex;align-items:center;gap:9px;padding:10px}.fileIcon{width:34px;height:34px;border-radius:9px;background:#f0f0f2;display:grid;place-items:center}.fileInfo{min-width:0;flex:1}.fileInfo strong{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fileInfo small{font-size:9px;color:#999}.download{border:1px solid #ddd;background:#f8f8f8;border-radius:8px;padding:6px 8px;text-decoration:none;color:#222;font-size:10px;font-weight:800}.deleteMsg{border:0;background:#fff0f1;color:#b90710;border-radius:8px;width:30px;height:30px;font-size:16px}.composer{border-top:1px solid #e7e7e9;padding:11px 13px;background:#fff}.attachPreview{display:none;align-items:center;gap:8px;margin-bottom:8px;padding:8px 10px;background:#f6f6f7;border-radius:10px;font-size:10px}.attachPreview.show{display:flex}.attachPreview span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.attachPreview button{border:0;background:#e9e9eb;border-radius:7px;width:25px;height:25px}.composeRow{display:grid;grid-template-columns:40px minmax(0,1fr) 46px;gap:8px;align-items:end}.attachBtn{width:40px;height:40px;border:1px solid #ddd;background:#f6f6f7;border-radius:11px;font-size:18px}.composer textarea{resize:none;max-height:120px;min-height:40px;border:1px solid #ddd;border-radius:12px;padding:10px 11px;outline:none;line-height:1.35}.composer textarea:focus{border-color:#e3061360;box-shadow:0 0 0 3px #e3061310}.send{width:46px;height:40px;border:0;border-radius:11px;background:#171717;color:#fff;font-size:19px;font-weight:900;box-shadow:inset 0 -3px 0 var(--red)}.send:disabled{opacity:.5}.empty{text-align:center;color:#999;padding:55px 15px;font-size:12px}
.nMenuWrap{position:relative}.nMenu{position:absolute;left:0;top:49px;width:245px;padding:8px;background:#fffffff7;border:1px solid #dedee2;border-radius:15px;box-shadow:0 16px 44px #0003;backdrop-filter:blur(16px);z-index:100}.hidden{display:none!important}.nMenuTitle{padding:7px 10px 8px;color:#999;font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.8px}.nMenu button{width:100%;display:grid;grid-template-columns:34px 1fr;gap:9px;align-items:center;text-align:left;padding:9px;border:0;border-radius:10px;background:transparent}.nMenu button:hover{background:#f4f4f5}.nMenu button>span{width:32px;height:32px;border-radius:9px;background:#f0f0f2;display:grid;place-items:center}.nMenu button strong{display:block;font-size:12px}.nMenu button small{display:block;font-size:10px;color:#888;margin-top:2px}.nMenu .logoutItem{margin-top:4px;border-top:1px solid #ececee;border-radius:0 0 9px 9px;color:#a30d15}.nMenu .logoutItem>span{background:#fff0f1;color:#b90710}
@media(max-width:760px){header{height:64px}.wrap{width:100%;height:calc(100dvh - 64px);display:block;padding:0}.side{display:none}.chat{height:100%;border:0;border-radius:0}.top{width:calc(100% - 22px)}.messages{padding:13px 11px 22px}.msg{grid-template-columns:32px minmax(0,1fr) auto}.avatar{width:32px;height:32px;border-radius:9px}.chatHead{padding:12px 13px}.composer{padding:9px 10px}.nMenu{position:fixed;left:10px;right:10px;top:62px;width:auto}}
</style>
</head>
<body>
<header><div class="top"><div class="brand"><div class="nMenuWrap"><button class="mark" onclick="toggleMenu(event)">N</button><div id="nMenu" class="nMenu hidden"><div class="nMenuTitle">Navigation</div><button onclick="location.href='home.html'"><span>⌂</span><div><strong>Accueil</strong><small>Choisir un outil</small></div></button><button onclick="location.href='index.html'"><span>☷</span><div><strong>Stock F&amp;L</strong><small>Gestion du stock</small></div></button><button onclick="location.href='planning.html'"><span>▦</span><div><strong>Planning</strong><small>Horaires de l’équipe</small></div></button><button class="settingsLink hidden" onclick="location.href='settings.html'"><span>⚙</span><div><strong>Personnalisation</strong><small>Réglages du portail</small></div></button><button class="logoutItem" onclick="logout()"><span>↪</span><div><strong>Déconnexion</strong><small>Quitter la session</small></div></button></div></div><div><div class="title">Équipe</div><div class="sub">Messagerie interne</div></div></div><button class="back" onclick="location.href='home.html'">← Retour</button></div></header>
<div class="wrap">
 <aside class="side"><h2>Chat équipe</h2><p>Un espace commun pour échanger pendant la journée.</p><div class="me"><strong id="meName">Connexion…</strong><small id="meRole"></small></div><div id="adminBox" class="adminBox hidden"><button class="adminReset" onclick="resetChat()">Réinitialiser la conversation</button></div><div class="tips">Photos, vidéos et documents peuvent être joints aux messages. Les pièces jointes restent accessibles au téléchargement.</div></aside>
 <section class="chat">
  <div class="chatHead"><strong>Conversation générale</strong><span class="live"><i></i> En direct</span></div>
  <div id="messages" class="messages"><div class="empty">Chargement des messages…</div></div>
  <div class="composer">
   <div id="attachPreview" class="attachPreview"><span id="attachName"></span><button onclick="clearAttachment()">×</button></div>
   <div class="composeRow"><button class="attachBtn" onclick="document.getElementById('file').click()" title="Joindre un fichier">＋</button><input id="file" type="file" hidden accept="image/*,video/*,.pdf,.txt,.doc,.docx,.xls,.xlsx" onchange="selectAttachment(this)"><textarea id="message" rows="1" placeholder="Écrire un message…" onkeydown="handleKey(event)"></textarea><button id="send" class="send" onclick="sendMessage()">↑</button></div>
  </div>
 </section>
</div>
<script>
const SUPABASE_URL='https://gioxrpaiwogqqtakjpnv.supabase.co',SUPABASE_KEY='sb_publishable_nJPMS-Z_20ng1aMJmufbmg_gWFFndrC';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let session=null,profile=null,messages=[],selectedFile=null,channel=null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toggleMenu(e){e?.stopPropagation();$('nMenu').classList.toggle('hidden')}function closeMenu(){$('nMenu').classList.add('hidden')}
document.addEventListener('click',e=>{if(!e.target.closest('.nMenuWrap'))closeMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
function initials(n){return String(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]?.toUpperCase()).join('')}
function dayLabel(v){const d=new Date(v),now=new Date(),y=new Date(now);y.setDate(now.getDate()-1);if(d.toDateString()===now.toDateString())return "Aujourd’hui";if(d.toDateString()===y.toDateString())return "Hier";return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
function timeLabel(v){return new Date(v).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
function sizeLabel(n){n=Number(n)||0;if(n<1024)return n+' o';if(n<1048576)return (n/1024).toFixed(1).replace('.',',')+' Ko';return (n/1048576).toFixed(1).replace('.',',')+' Mo'}
async function signed(path){if(!path)return null;const {data}=await db.storage.from('chat-files').createSignedUrl(path,3600);return data?.signedUrl||null}
async function renderMessages(){const box=$('messages');if(!messages.length){box.innerHTML='<div class="empty">Aucun message pour le moment.<br>Tu peux lancer la conversation.</div>';return}let html='',lastDay='';for(const m of messages){const day=dayLabel(m.created_at);if(day!==lastDay){html+='<div class="daySep">'+esc(day)+'</div>';lastDay=day}const mine=m.user_id===session?.user?.id;let attachment='';if(m.attachment_path){const url=await signed(m.attachment_path);if(url){const type=m.attachment_type||'';if(type.startsWith('image/'))attachment='<div class="attachment"><img src="'+esc(url)+'" alt=""><div class="fileRow"><div class="fileInfo"><strong>'+esc(m.attachment_name||'Image')+'</strong><small>'+sizeLabel(m.attachment_size)+'</small></div><a class="download" href="'+esc(url)+'" target="_blank" rel="noopener">Télécharger</a></div></div>';else if(type.startsWith('video/'))attachment='<div class="attachment"><video controls preload="metadata" src="'+esc(url)+'"></video><div class="fileRow"><div class="fileInfo"><strong>'+esc(m.attachment_name||'Vidéo')+'</strong><small>'+sizeLabel(m.attachment_size)+'</small></div><a class="download" href="'+esc(url)+'" target="_blank" rel="noopener">Télécharger</a></div></div>';else attachment='<div class="attachment"><div class="fileRow"><div class="fileIcon">📎</div><div class="fileInfo"><strong>'+esc(m.attachment_name||'Pièce jointe')+'</strong><small>'+sizeLabel(m.attachment_size)+'</small></div><a class="download" href="'+esc(url)+'" target="_blank" rel="noopener">Télécharger</a></div></div>'}}html+='<article class="msg '+(mine?'mine':'')+'"><div class="avatar">'+esc(initials(m.display_name))+'</div><div class="bubble"><div class="msgTop"><strong>'+esc(m.display_name||'Utilisateur')+'</strong><time>'+esc(timeLabel(m.created_at))+'</time></div>'+(m.body?'<div class="body">'+esc(m.body)+'</div>':'')+attachment+'</div>'+(profile?.role==='admin'?'<button class="deleteMsg" onclick="deleteMessage('+m.id+')" title="Supprimer">×</button>':'')+'</article>'}box.innerHTML=html;box.scrollTop=box.scrollHeight}
async function loadMessages(){const {data,error}=await db.from('chat_messages').select('*').order('created_at',{ascending:true}).limit(300);if(error){$('messages').innerHTML='<div class="empty"><strong>Chat indisponible.</strong><br>La base de données du chat doit être initialisée.</div>';return}messages=data||[];await renderMessages()}
function selectAttachment(input){const f=input.files?.[0];if(!f)return;if(f.size>25*1024*1024){alert('Pièce jointe trop lourde : 25 Mo maximum.');input.value='';return}selectedFile=f;$('attachName').textContent=f.name+' • '+sizeLabel(f.size);$('attachPreview').classList.add('show')}
function clearAttachment(){selectedFile=null;$('file').value='';$('attachPreview').classList.remove('show')}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}}
async function sendMessage(){const body=$('message').value.trim();if(!body&&!selectedFile)return;const btn=$('send');btn.disabled=true;try{let path=null,name=null,type=null,size=null;if(selectedFile){const ext=(selectedFile.name.split('.').pop()||'bin').replace(/[^a-z0-9]/gi,'').toLowerCase();path=session.user.id+'/'+Date.now()+'-'+crypto.randomUUID()+'.'+ext;const {error:up}=await db.storage.from('chat-files').upload(path,selectedFile,{upsert:false});if(up)throw up;name=selectedFile.name;type=selectedFile.type||'application/octet-stream';size=selectedFile.size}const {error}=await db.from('chat_messages').insert({user_id:session.user.id,display_name:profile.display_name||profile.email?.split('@')[0]||'Utilisateur',body:body||null,attachment_path:path,attachment_name:name,attachment_type:type,attachment_size:size});if(error){if(path)await db.storage.from('chat-files').remove([path]);throw error}$('message').value='';clearAttachment();await loadMessages()}catch(e){alert('Envoi impossible : '+e.message)}finally{btn.disabled=false}}
async function deleteMessage(id){if(profile?.role!=='admin')return;const m=messages.find(x=>x.id===id);if(!confirm('Supprimer ce message ?'))return;if(m?.attachment_path)await db.storage.from('chat-files').remove([m.attachment_path]);const {error}=await db.from('chat_messages').delete().eq('id',id);if(error)return alert('Suppression impossible : '+error.message);await loadMessages()}
async function resetChat(){if(profile?.role!=='admin')return;if(!confirm('Réinitialiser toute la conversation ? Cette action supprime aussi les pièces jointes.'))return;const paths=messages.map(m=>m.attachment_path).filter(Boolean);if(paths.length)await db.storage.from('chat-files').remove(paths);const {error}=await db.from('chat_messages').delete().gt('id',0);if(error)return alert('Réinitialisation impossible : '+error.message);await loadMessages()}
async function logout(){closeMenu();await db.auth.signOut();location.href='index.html'}
async function boot(){const {data:{session:s}}=await db.auth.getSession();session=s;if(!session){location.replace('index.html');return}const {data:p,error}=await db.from('profiles').select('display_name,email,role').eq('id',session.user.id).maybeSingle();if(error||!p){location.replace('index.html');return}profile=p;window.currentRole=p.role;await loadSharedSiteConfig();$('meName').textContent=p.display_name||p.email;$('meRole').textContent=p.role;$('adminBox').classList.toggle('hidden',p.role!=='admin');await loadMessages();channel=db.channel('chat-general').on('postgres_changes',{event:'*',schema:'public',table:'chat_messages'},()=>loadMessages()).subscribe();setInterval(loadMessages,15000)}
boot();

async function loadSharedSiteConfig(){
 try{
  if(!db)return null;
  const {data}=await db.from('app_settings').select('value').eq('key','site_config').maybeSingle();
  const cfg=data?.value;if(!cfg)return null;
  applySharedSiteConfig(cfg);return cfg;
 }catch(e){console.warn('Réglages du site:',e);return null}
}
function setMenuEntry(urlKey,cfg){
 const n=cfg?.nav?.[urlKey];if(!n)return;
 const defaults={home:'home.html',stock:'index.html',planning:'planning.html',chat:'chat.html',test:'stock-test.html'};
 const old=defaults[urlKey];
 document.querySelectorAll('#nMenu button,#brandMenu button').forEach(b=>{
  const oc=b.getAttribute('onclick')||'';
  if(!oc.includes("'"+old+"'")&&!oc.includes('"'+old+'"'))return;
  const icon=b.querySelector(':scope > span'),strong=b.querySelector('strong'),small=b.querySelector('small');
  if(icon)icon.textContent=n.icon||icon.textContent;if(strong)strong.textContent=n.label||strong.textContent;if(small)small.textContent=n.subtitle||'';
  const target=String(n.url||old).replace(/['"<>]/g,'');b.onclick=()=>location.href=target;
 });
}
function applySharedSiteConfig(cfg){
 ['home','stock','planning','chat','test'].forEach(k=>setMenuEntry(k,cfg));
 const pt=cfg?.pageTitles?.['chat'];
 if(pt){const t=document.querySelector('header .title');const s=document.querySelector('header .subtitle,header .sub');if(t&&pt.title)t.textContent=pt.title;if(s&&pt.subtitle)s.textContent=pt.subtitle}
 const settings=document.querySelectorAll('.settingsLink');settings.forEach(x=>x.classList.toggle('hidden',!(window.currentRole==='admin'||window.planningCanEdit||profile?.role==='admin')));
}

</script>
</body></html>
