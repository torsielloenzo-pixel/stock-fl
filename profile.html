<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171717"><script>(function(){try{var t=localStorage.getItem('nettoTheme')||'light';document.documentElement.dataset.theme=t}catch(e){}})();</script>
<title>Netto — Mon profil</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--red:#ff2f1f;--orange:#ff8500;--black:#171717;--line:#e5e7eb;--muted:#777;--grad:linear-gradient(135deg,#ff2f1f 0%,#ff151f 44%,#ff8500 100%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182235;background:radial-gradient(circle at 0 20%,#ff2f1f0b,transparent 27%),radial-gradient(circle at 100% 85%,#ff85000b,transparent 30%),linear-gradient(135deg,#f7f8fa,#fff 50%,#f3f5f7)}
button,input{font:inherit}button{cursor:pointer}
header{height:70px;background:#ffffffef;border-bottom:1px solid #e5e7eb;box-shadow:0 5px 20px #0000000a;display:flex;align-items:center;position:relative;z-index:20}header:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--grad)}
.top{width:min(94vw,980px);margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.mark{width:40px;height:40px;border:0;border-radius:10px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:21px;font-weight:950;box-shadow:0 6px 16px #ff3b1f2d}.title{font-size:19px;font-weight:900}.sub{font-size:11px;color:#888;margin-top:2px}.back{border:1px solid #ddd;background:#fff;border-radius:11px;padding:9px 12px;font-weight:800}
main{width:min(92vw,760px);margin:auto;padding:50px 0 70px}.hero{text-align:center;margin-bottom:20px}.hero h1{font-size:34px;margin:0 0 7px}.hero p{margin:0;color:#777;font-size:13px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:24px;box-shadow:0 12px 34px #1822350d}.profileTop{display:grid;grid-template-columns:130px minmax(0,1fr);gap:24px;align-items:center}
.avatarWrap{position:relative;width:126px;height:126px}.avatar{width:126px;height:126px;border-radius:32px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:38px;font-weight:950;overflow:hidden;box-shadow:0 10px 28px #ff3b1f2a}.avatar img{width:100%;height:100%;object-fit:cover}.avatarBadge{position:absolute;right:-4px;bottom:3px;width:34px;height:34px;border-radius:50%;border:4px solid #fff;background:#171717;color:#fff;display:grid;place-items:center;font-size:14px}
.name{font-size:24px;font-weight:900}.role{font-size:11px;color:#f13b20;font-weight:850;text-transform:uppercase;letter-spacing:.65px;margin-top:5px}.email{font-size:12px;color:#888;margin-top:6px}.divider{height:1px;background:#eceef1;margin:22px 0}
.uploadBox{border:1px dashed #d8dbe0;border-radius:16px;padding:17px;background:#fafbfc}.uploadBox strong{font-size:13px}.uploadBox p{font-size:11px;color:#888;margin:5px 0 14px}.buttons{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800}.primary{background:var(--grad);color:#fff;box-shadow:0 7px 18px #ff3b1f28}.secondary{background:#f0f1f3;color:#222}.danger{background:#fff2ef;color:#bd271a;border:1px solid #ffd8cb}.state{font-size:10px;color:#888;margin-top:10px;min-height:15px}
.nMenuWrap{position:relative}.nMenu{position:absolute;left:0;top:49px;width:255px;padding:8px;background:#fffffff8;border:1px solid #dedee2;border-radius:15px;box-shadow:0 16px 44px #0003;backdrop-filter:blur(16px);z-index:100}.hidden{display:none!important}.nMenuTitle{padding:7px 10px 8px;color:#f33a22;font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.8px}.nMenu button{width:100%;display:grid;grid-template-columns:34px 1fr;gap:9px;align-items:center;text-align:left;padding:9px;border:0;border-radius:10px;background:transparent}.nMenu button:hover{background:linear-gradient(90deg,#fff1ef,#fff8ef)}.nMenu button>span{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#fff0ed,#fff7ec);color:#f43a20;display:grid;place-items:center}.nMenu button strong{display:block;font-size:12px}.nMenu button small{display:block;font-size:10px;color:#888;margin-top:2px}.nMenu .logoutItem{margin-top:4px;border-top:1px solid #ececee;border-radius:0 0 9px 9px;color:#a30d15}
:root[data-theme="dark"]{color-scheme:dark}:root[data-theme="dark"] body{background:#111317;color:#f4f4f5}:root[data-theme="dark"] header{background:#17191df0;border-color:#2d3036}:root[data-theme="dark"] .card{background:#1b1d22;border-color:#30333a}:root[data-theme="dark"] .uploadBox{background:#202126;border-color:#3a3c42}:root[data-theme="dark"] .secondary,:root[data-theme="dark"] .back{background:#242529;color:#eee;border-color:#393a40}:root[data-theme="dark"] .nMenu{background:#1c1d20f6;border-color:#38393e}:root[data-theme="dark"] .nMenu button:hover{background:linear-gradient(90deg,#38211d,#2d241d)}:root[data-theme="dark"] .nMenu button>span{background:#32231f;color:#ff8a55}:root[data-theme="dark"] .avatarBadge{border-color:#1b1d22}
@media(max-width:600px){main{padding-top:30px}.profileTop{grid-template-columns:1fr;text-align:center}.avatarWrap{margin:auto}.buttons{justify-content:center}.card{padding:20px}}
</style></head>
<body>
<header><div class="top"><div class="brand"><div class="nMenuWrap"><button class="mark" onclick="toggleMenu(event)">N</button><div id="nMenu" class="nMenu hidden"><div class="nMenuTitle">Navigation</div><button onclick="location.href='home.html'"><span>⌂</span><div><strong>Accueil</strong><small>Choisir un outil</small></div></button><button onclick="location.href='profile.html'"><span>☺</span><div><strong>Mon profil</strong><small>Photo et compte</small></div></button><button onclick="location.href='index.html'"><span>☷</span><div><strong>Stock F&amp;L</strong><small>Gestion du stock</small></div></button><button onclick="location.href='planning.html'"><span>▦</span><div><strong>Planning</strong><small>Horaires de l'équipe</small></div></button><button onclick="location.href='chat.html'"><span>◉</span><div><strong>Équipe</strong><small>Messagerie interne</small></div></button><button class="themeToggle" onclick="toggleTheme(event)"><span class="themeIcon">☾</span><div><strong class="themeLabel">Mode sombre</strong><small class="themeSub">Passer au thème sombre</small></div></button><button class="logoutItem" onclick="logout()"><span>↪</span><div><strong>Déconnexion</strong><small>Quitter la session</small></div></button></div></div><div><div class="title">Mon profil</div><div class="sub">Personnalisation du compte</div></div></div><button class="back" onclick="location.href='home.html'">← Retour</button></div></header>
<main><div class="hero"><h1>Mon profil</h1><p>Choisis l’image qui te représentera dans les outils du site.</p></div><section class="card"><div class="profileTop"><div class="avatarWrap"><div id="avatar" class="avatar">U</div><div class="avatarBadge">✎</div></div><div><div id="displayName" class="name">Utilisateur</div><div id="role" class="role"></div><div id="email" class="email"></div></div></div><div class="divider"></div><div class="uploadBox"><strong>Icône de profil</strong><p>Image JPG, PNG, WebP ou GIF • 5 Mo maximum. L’image sera affichée au format carré.</p><input id="avatarInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden onchange="previewFile(this)"><div class="buttons"><button class="btn primary" onclick="avatarInput.click()">Choisir une image</button><button id="saveBtn" class="btn secondary" onclick="saveAvatar()" disabled>Enregistrer</button><button id="removeBtn" class="btn danger" onclick="removeAvatar()">Supprimer la photo</button></div><div id="state" class="state"></div></div></section></main>
<script>
const SUPABASE_URL='https://gioxrpaiwogqqtakjpnv.supabase.co',SUPABASE_KEY='sb_publishable_nJPMS-Z_20ng1aMJmufbmg_gWFFndrC',db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let session=null,profile=null,selectedFile=null,currentObjectUrl=null;
const $=id=>document.getElementById(id);
function initials(n){return String(n||'U').trim().split(/\s+/).slice(0,2).map(x=>x[0]?.toUpperCase()).join('')}
async function avatarUrl(path){if(!path)return null;const {data}=await db.storage.from('profile-avatars').createSignedUrl(path,3600);return data?.signedUrl||null}
async function paintAvatar(path){const el=$('avatar'),url=await avatarUrl(path);el.innerHTML='';if(url){const img=document.createElement('img');img.src=url;img.alt='Photo de profil';el.appendChild(img)}else el.textContent=initials(profile?.display_name||profile?.email)}
function previewFile(input){const f=input.files?.[0];if(!f)return;if(f.size>5*1024*1024){alert('Image trop lourde : 5 Mo maximum.');input.value='';return}selectedFile=f;if(currentObjectUrl)URL.revokeObjectURL(currentObjectUrl);currentObjectUrl=URL.createObjectURL(f);$('avatar').innerHTML='<img src="'+currentObjectUrl+'" alt="Aperçu">';$('saveBtn').disabled=false;$('state').textContent='Aperçu prêt à être enregistré.'}
async function saveAvatar(){if(!selectedFile)return;const b=$('saveBtn');b.disabled=true;$('state').textContent='Enregistrement…';try{const ext=(selectedFile.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path=session.user.id+'/avatar-'+Date.now()+'.'+ext;const {error:up}=await db.storage.from('profile-avatars').upload(path,selectedFile,{upsert:false});if(up)throw up;const old=profile.avatar_path;const {error}=await db.from('profiles').update({avatar_path:path}).eq('id',session.user.id);if(error){await db.storage.from('profile-avatars').remove([path]);throw error}if(old)await db.storage.from('profile-avatars').remove([old]);profile.avatar_path=path;selectedFile=null;$('avatarInput').value='';$('saveBtn').disabled=true;await paintAvatar(path);$('state').textContent='✓ Photo de profil enregistrée.'}catch(e){$('state').textContent='Erreur : '+e.message;b.disabled=false}}
async function removeAvatar(){if(!profile?.avatar_path)return;if(!confirm('Supprimer ta photo de profil ?'))return;const old=profile.avatar_path;const {error}=await db.from('profiles').update({avatar_path:null}).eq('id',session.user.id);if(error)return alert(error.message);await db.storage.from('profile-avatars').remove([old]);profile.avatar_path=null;selectedFile=null;await paintAvatar(null);$('state').textContent='Photo supprimée.'}
function toggleMenu(e){e?.stopPropagation();$('nMenu').classList.toggle('hidden')}document.addEventListener('click',e=>{if(!e.target.closest('.nMenuWrap'))$('nMenu').classList.add('hidden')});
function currentTheme(){return document.documentElement.dataset.theme==='dark'?'dark':'light'}function applyTheme(t){t=t==='dark'?'dark':'light';document.documentElement.dataset.theme=t;localStorage.setItem('nettoTheme',t);document.querySelectorAll('.themeIcon').forEach(x=>x.textContent=t==='dark'?'☀':'☾');document.querySelectorAll('.themeLabel').forEach(x=>x.textContent=t==='dark'?'Mode clair':'Mode sombre');document.querySelectorAll('.themeSub').forEach(x=>x.textContent=t==='dark'?'Revenir au thème clair':'Passer au thème sombre')}function toggleTheme(e){e?.stopPropagation();applyTheme(currentTheme()==='dark'?'light':'dark')}
async function logout(){await db.auth.signOut();location.href='index.html'}
async function boot(){const {data:{session:s}}=await db.auth.getSession();session=s;if(!s)return location.replace('index.html');const {data:p,error}=await db.from('profiles').select('display_name,email,role,avatar_path').eq('id',s.user.id).maybeSingle();if(error||!p)return location.replace('index.html');profile=p;$('displayName').textContent=p.display_name||p.email?.split('@')[0]||'Utilisateur';$('email').textContent=p.email||s.user.email||'';$('role').textContent=({admin:'Administrateur',responsable:'Responsable',lecture:'Lecture seule',employe:'Employé'})[p.role]||p.role||'';$('removeBtn').disabled=!p.avatar_path;await paintAvatar(p.avatar_path);applyTheme(currentTheme())}
boot();
</script></body></html>
