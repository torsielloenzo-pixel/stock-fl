/* DA Netto rouge-orangé inspirée du visuel fourni */
:root{
  --netto-red:#ff2f1f;
  --netto-red-2:#ff151f;
  --netto-orange:#ff8500;
  --netto-orange-soft:#ff9f1a;
  --netto-gradient:linear-gradient(135deg,#ff2f1f 0%,#ff151f 44%,#ff8500 100%);
  --netto-gradient-soft:linear-gradient(135deg,#fff2ef 0%,#fff7ed 100%);
  --netto-ink:#182235;
  --netto-surface:#ffffff;
  --netto-border:#e7e9ed;
}
body{background:
  radial-gradient(circle at 0% 16%,#ff2f1f0a 0,transparent 26%),
  radial-gradient(circle at 100% 88%,#ff85000b 0,transparent 28%),
  linear-gradient(135deg,#f7f8fa 0%,#ffffff 48%,#f3f5f7 100%)!important}
header{background:#ffffffef!important;border-bottom:1px solid #e8e9ec!important;box-shadow:0 5px 20px #1b23300b!important}
header:after{background:var(--netto-gradient)!important;height:3px!important}
.mark,.brandMark,.loginMark,.welcomeMark{
  background:var(--netto-gradient)!important;
  color:#fff!important;
  box-shadow:0 6px 16px #ff3b1f2d!important;
  border:0!important;
}
.manage,.primary,.dark,.send,.loginSubmit{
  background:var(--netto-gradient)!important;
  color:#fff!important;
  box-shadow:0 7px 18px #ff3b1f28!important;
  border:0!important;
}
.manage:hover,.primary:hover,.dark:hover,.send:hover,.loginSubmit:hover{filter:brightness(.98);transform:translateY(-1px)}
.fab,.cartCount{background:var(--netto-gradient)!important}
.suggestTopIcon{background:#fff1ed!important;color:#ff3b1f!important;box-shadow:none!important}
.suggestTop:hover .suggestTopIcon{background:var(--netto-gradient)!important;color:#fff!important}
.nMenuTitle,.brandMenuTitle{color:#f33a22!important}
.nMenu button:hover,.brandMenu button:hover,.userMenu button:hover{background:linear-gradient(90deg,#fff1ef,#fff8ef)!important}
.nMenu button>span,.brandMenu button>span,.userMenu button>span{
  background:linear-gradient(135deg,#fff0ed,#fff7ec)!important;
  color:#f43a20!important;
}
.themeToggle .themeIcon,.userThemeToggle .themeIcon{color:#ff6f00!important}
.logoutItem,.brandLogout,.userLogout{color:#b81717!important}
.logoutItem>span,.brandLogout>span,.userLogout>span{background:#fff0ef!important;color:#e3261a!important}
input:focus,textarea:focus,select:focus,.search:focus,.searchBox input:focus{
  border-color:#ff6a3d88!important;
  box-shadow:0 0 0 3px #ff5a2a16!important;
}
.modal h2:after,.subtitle:before{background:var(--netto-gradient)!important}
.editTab.active{box-shadow:inset 0 -3px 0 #ff4b22,0 2px 6px #0000000b!important}
.categoryFilter.active,.suggestTab.active{box-shadow:0 7px 18px #ff4c2024!important}
.userAvatar,.avatar,.memberAvatar{
  background:var(--netto-gradient)!important;
  box-shadow:0 4px 12px #ff3b1f2a!important;
}
.pageCard,.panel,.side,.chat,.sheet,.modal,.category,.cat,.group,.tabPanel{
  border-color:#e5e7eb!important;
  box-shadow:0 10px 28px #1a22300b!important;
}
.pageCard:hover,.panel:hover{box-shadow:0 16px 38px #ff522012!important;border-color:#ffd3c7!important}
.cardKicker,.eyebrow{color:#ed2d1d!important}
.stock .arrow,.chatCard .arrow{background:var(--netto-gradient)!important;color:#fff!important}
.stock .icon,.planning .icon,.chatCard .icon{
  background:linear-gradient(135deg,#fff0ec,#fff7ed)!important;
  color:#f43b20!important;
  border:1px solid #ffd8ca!important;
  box-shadow:none!important;
}
.stock .icon{background:var(--netto-gradient)!important;color:#fff!important;border:0!important}
.cardFoot{background:linear-gradient(180deg,#fff,#fffaf7)!important}

.day.active,.paintChoice.active{background:var(--netto-gradient)!important;color:#fff!important;border-color:transparent!important}
.btn.activeEdit{background:var(--netto-gradient)!important;color:#fff!important}
.adminReset,.danger{background:#fff3ef!important;border-color:#ffd8cc!important;color:#c62518!important}
.live i,.onlineDot.on{background:#23ad55!important}
.notice{border-left:4px solid #ff5f1f!important}

  linear-gradient(145deg,#14161a 0 56%,#201a18 100%)!important}
