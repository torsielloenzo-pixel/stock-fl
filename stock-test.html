<style>
:root{--bg:#f4f4f6;--line:#e5e5e8;--text:#18181b;--muted:#777}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f0f1f3,#fafafa 45%,#eef0f1);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}button,input{font:inherit}header{position:sticky;top:0;z-index:5;background:#ffffffed;backdrop-filter:blur(14px);border-bottom:1px solid #ddd;padding:12px 18px}.top{max-width:1280px;margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.mark{width:39px;height:39px;border-radius:12px;background:#202024;color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px}.title{font-size:20px;font-weight:850}.sub{font-size:12px;color:#777}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:750;cursor:pointer;background:#ececef;color:#333}main{max-width:1280px;margin:auto;padding:22px}.intro{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}.intro h1{font-size:27px;margin:0 0 4px;letter-spacing:-.7px}.intro p{margin:0;color:#777;font-size:13px}.search{width:min(360px,100%);padding:12px 14px;border:1px solid #ddd;border-radius:13px;background:#fff}.cat{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:12px 0;box-shadow:0 6px 20px #00000008}.catHead{width:100%;border:0;color:#fff;padding:14px 17px;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;font-weight:850;font-size:17px}.catHead .count{font-size:12px;opacity:.78}.catHead .arrow{margin-left:auto}.cat.closed .catBody{display:none}.cat.closed .arrow{transform:rotate(-90deg)}.catBody{padding:8px 12px 13px}.group{border-bottom:1px solid #ededf0}.group:last-child{border:0}.groupHead{width:100%;border:0;background:#fff;display:grid;grid-template-columns:48px minmax(180px,1fr) 120px 38px;align-items:center;gap:11px;padding:10px 5px;text-align:left;cursor:pointer}.groupThumb{width:44px;height:44px;border-radius:11px;object-fit:cover;background:#eee;display:grid;place-items:center;font-size:21px}.groupName{font-weight:800;font-size:15px}.groupMeta{font-size:12px;color:#888;margin-top:2px}.groupQty{text-align:right;font-weight:850}.groupArrow{text-align:center;color:#777}.group.closed .variants{display:none}.group.closed .groupArrow{transform:rotate(-90deg)}.variants{padding:0 0 9px 59px}.row{display:grid;grid-template-columns:minmax(180px,1.5fr) minmax(90px,.7fr) minmax(100px,.8fr) 150px;gap:12px;align-items:center;min-height:50px;padding:6px 8px;border-top:1px solid #f0f0f2}.product{display:flex;align-items:center;gap:10px;min-width:0}.thumb{width:40px;height:40px;border-radius:9px;object-fit:cover;background:#eee;flex:none}.pname{font-weight:720;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:#777}.counter{height:36px;display:grid;grid-template-columns:38px 1fr 38px;background:#f0f0f2;border-radius:10px;overflow:hidden}.counter button{border:0;background:transparent;font-size:19px;cursor:pointer}.counter .plus{background:#202024;color:#fff}.qty{display:grid;place-items:center;font-weight:850}.zero{color:#d20b19}.empty{padding:25px;color:#888;text-align:center}.columnGuide{display:grid;grid-template-columns:minmax(180px,1.5fr) minmax(90px,.7fr) minmax(100px,.8fr) 150px;gap:12px;padding:0 20px 7px 79px;color:#999;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.55px}.columnGuide span:last-child{text-align:center}@media(max-width:799px){.columnGuide{display:none}}
@media(max-width:799px){main{padding:12px}.intro{align-items:stretch;flex-direction:column}.search{width:100%}.row{grid-template-columns:minmax(150px,1fr) 110px 140px}.row>.meta:nth-of-type(2){display:none}.variants{padding-left:10px}.groupHead{grid-template-columns:48px minmax(140px,1fr) 80px 38px}}

html{scroll-behavior:smooth}.btn,.cat,.catHead,.groupHead,.row,.counter button,.search{transition:all .2s ease}button:active{transform:scale(.97)}@media(hover:hover){.cat{transition:transform .22s ease,box-shadow .22s ease}.cat:hover{box-shadow:0 10px 30px #0000000d}.groupHead:hover{background:#fafafa}.row:hover{background:#fafafa}.btn:hover{background:#dedee2}}
.catBody{display:block!important;max-height:7000px;opacity:1;overflow:hidden;transition:max-height .42s cubic-bezier(.22,.8,.3,1),opacity .25s ease,padding .35s ease}.cat.closed .catBody{display:block;max-height:0;opacity:0;padding-top:0;padding-bottom:0;pointer-events:none}.arrow,.groupArrow{transition:transform .3s cubic-bezier(.22,.8,.3,1)}
.variants{display:block!important;max-height:3500px;opacity:1;overflow:hidden;transition:max-height .36s cubic-bezier(.22,.8,.3,1),opacity .22s ease,padding .3s ease}.group.closed .variants{display:block;max-height:0;opacity:0;padding-top:0;padding-bottom:0;pointer-events:none}.row{animation:rowIn .25s ease both}@keyframes rowIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.search:focus{outline:0;border-color:#aaa;box-shadow:0 7px 22px #0000000d;transform:translateY(-1px)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* Vue desktop réellement exploitable */
main{width:min(96vw,1560px);max-width:none;padding:28px 30px 60px}
.top{width:min(96vw,1560px);max-width:none}
.intro h1{font-size:32px}.intro p{font-size:14px}.search{width:min(420px,100%);height:48px;font-size:14px}
.cat{border-radius:20px;margin:16px 0}.catHead{min-height:58px;padding:16px 20px;font-size:19px}.catHead .count{font-size:13px}

@media(max-width:1100px){main,.top{width:100%}main{padding:20px}.row{grid-template-columns:minmax(220px,1fr) 120px 140px}.row>.meta:nth-of-type(2){display:none}.columnGuide{display:none}}

/* Edition visuelle des menus de la vue test */
.topActions{display:flex;gap:8px;align-items:center}.btn.activeEdit{background:#202024;color:#fff}
.menuEditBar{display:flex;align-items:center;gap:6px;padding:7px 9px;background:#fff7f7;border-bottom:1px solid #f1d7d9;font-size:11px}.menuEditBar span{flex:1;font-weight:800;color:#7a3337}.menuEditBar button{border:1px solid #e5d5d6;background:#fff;border-radius:8px;padding:5px 8px;font-size:11px;font-weight:750;cursor:pointer}.menuEditBar button:hover{background:#202024;color:#fff;border-color:#202024}.categoryEdit{background:#f7f7f8;border-color:#e8e8eb}.categoryEdit span{color:#666}.familyEdit{margin-left:0;border-top:1px solid #f1d7d9}

</style></head><body>
<header><div class="top"><div class="brand"><div class="mark">N</div><div><div class="title">Stock groupé <span style="font-size:11px;color:#888">TEST</span></div><div class="sub">Vue ordinateur • Fruits & Légumes</div></div></div><div class="topActions"><button id="editMenusBtn" class="btn" onclick="toggleMenuEdit()">✎ Menus</button><button class="btn" onclick="location.href='index.html'">← Stock</button></div></div></header>
<main><div class="intro"><div><h1>Vue par familles</h1><p>Les variantes d’un même produit sont regroupées dans un sous-menu dépliable.</p></div><input id="search" class="search" type="search" placeholder="Rechercher…" oninput="render()"></div><div class="columnGuide"><span>Famille / Article</span><span>Conditionnement</span><span>Catégorie</span><span>Quantité</span></div><div id="app"><div class="empty">Chargement…</div></div></main>
<script>
const SUPABASE_URL='https://gioxrpaiwogqqtakjpnv.supabase.co',SUPABASE_KEY='sb_publishable_nJPMS-Z_20ng1aMJmufbmg_gWFFndrC';let db=null;
const META={'Fruits':['🍎','#c83c48','#e86b62'],'Légumes':['🥬','#347b55','#69a85f'],'Salades':['🥗','#668d3c','#9abf5b'],'Pommes de terre':['🥔','#806040','#ad875f'],'Herbes aromatiques':['🌿','#34704b','#62a774'],'Condiments':['🧅','#8c6848','#b38b65']};
let products=[],profile={role:'admin'},closed={},editMenus=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function family(name){let s=String(name||'').trim().toLowerCase().replace(/^(pomme|poire|tomate|courgette|orange|citron|melon|pastèque|raisin|kiwi|banane|aubergine|poivron|concombre|carotte|oignon|échalote|ail|avocat|mangue|ananas|pêche|nectarine|abricot|prune|fraise|framboise|myrtille|champignon|radis|navet|poireau|céleri|fenouil|chou|endive|salade|batavia)\s*[:\-]?\s*/i,(m)=>m.trim().replace(/[:\-]$/,'').trim()+'|');if(s.includes('|'))return s.split('|')[0].replace(/^./,x=>x.toUpperCase());return String(name||'Article').split(/[:\-]/)[0].trim().split(' ')[0].replace(/^./,x=>x.toUpperCase())}
const FAMILY_ORDER=[
 'Pomme','Poire','Raisin',
 'Orange','Mandarine','Clémentine','Clementine','Citron','Pamplemousse',
 'Pêche','Peche','Nectarine','Abricot','Prune',
 'Fraise','Framboise','Myrtille',
 'Melon','Pastèque','Pasteque',
 'Banane','Kiwi','Ananas','Mangue','Avocat',
 'Tomate','Poivron','Aubergine','Courgette','Concombre',
 'Carotte','Radis','Navet','Poireau','Céleri','Celeri','Fenouil','Chou','Champignon','Endive',
 'Batavia','Salade',
 'Oignon','Échalote','Echalote','Ail'
];
function familyRank(name){const n=String(name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const i=FAMILY_ORDER.findIndex(x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()===n);return i<0?999:i}
function familyCompare(a,b){const ra=familyRank(a),rb=familyRank(b);return ra!==rb?ra-rb:String(a).localeCompare(String(b),'fr',{sensitivity:'base'})}
function isClosed(k){return closed[k]!==false}
function getMenuLayout(){try{return JSON.parse(localStorage.getItem('nettoTestMenuLayout')||'{}')||{}}catch(e){return {}}}
function saveMenuLayout(v){localStorage.setItem('nettoTestMenuLayout',JSON.stringify(v));render()}
function catLabel(cat){const l=getMenuLayout();return l.catNames?.[cat]||cat}
function familyLabel(cat,f){const l=getMenuLayout();return l.familyNames?.[cat+'|'+f]||f}
function catOrder(){const l=getMenuLayout(),base=Object.keys(META),saved=(l.catOrder||[]).filter(x=>base.includes(x));return [...saved,...base.filter(x=>!saved.includes(x))]}
function familyOrder(cat,names){const l=getMenuLayout(),saved=(l.familyOrder?.[cat]||[]).filter(x=>names.includes(x));const rest=names.filter(x=>!saved.includes(x)).sort(familyCompare);return [...saved,...rest]}
function toggleMenuEdit(){editMenus=!editMenus;document.getElementById('editMenusBtn').textContent=editMenus?'✓ Terminer':'✎ Menus';document.getElementById('editMenusBtn').classList.toggle('activeEdit',editMenus);render();playUISound(editMenus?'open':'close')}
function renameCat(cat){const v=prompt('Nom affiché de la catégorie :',catLabel(cat));if(v===null)return;const name=v.trim();if(!name)return;const l=getMenuLayout();l.catNames={...(l.catNames||{}),[cat]:name};saveMenuLayout(l)}
function moveCat(cat,dir){const l=getMenuLayout(),arr=catOrder(),i=arr.indexOf(cat),j=i+dir;if(i<0||j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];l.catOrder=arr;saveMenuLayout(l)}
function renameFamily(cat,f){const v=prompt('Nom affiché du menu :',familyLabel(cat,f));if(v===null)return;const name=v.trim();if(!name)return;const l=getMenuLayout();l.familyNames={...(l.familyNames||{}),[cat+'|'+f]:name};saveMenuLayout(l)}
function moveFamily(cat,f,dir){const names=[...new Set(products.filter(p=>p.category===cat).map(p=>family(p.name)))],l=getMenuLayout(),arr=familyOrder(cat,names),i=arr.indexOf(f),j=i+dir;if(i<0||j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];l.familyOrder={...(l.familyOrder||{}),[cat]:arr};saveMenuLayout(l)}
function resetMenuLayout(){if(!confirm('Réinitialiser les noms et emplacements personnalisés de cette page ?'))return;localStorage.removeItem('nettoTestMenuLayout');render()}


function nextQty(q,d){q=Number(q)||0;if(d>0)return q===0?.5:q+.5===1?1:q>=1?q+1:q+.5;if(q<=0)return 0;if(q===.5)return 0;if(q===1)return .5;return Math.max(1,q-1)}
async function change(id,d){playUISound('tick');if(!['admin','responsable','employe'].includes(profile?.role))return;const p=products.find(x=>x.id===id);if(!p)return;const old=p.quantity,pq=nextQty(old,d);p.quantity=pq;render();const {error}=await db.from('products').update({quantity:pq}).eq('id',id);if(error){p.quantity=old;render();alert('Modification impossible : '+error.message)}}
function toggle(k){closed[k]=isClosed(k)?false:true;playUISound(isClosed(k)?'close':'open');render()}
function render(){const q=document.getElementById('search').value.trim().toLowerCase(),app=document.getElementById('app');let html='';catOrder().forEach(cat=>{let items=products.filter(p=>p.category===cat&&(!q||[p.name,p.packaging,p.article_code].some(v=>String(v||'').toLowerCase().includes(q))));const groups={};items.forEach(p=>{const f=family(p.name);(groups[f]??=[]).push(p)});const ck='cat:'+cat,[em,a,b]=META[cat];html+='<section class="cat '+(isClosed(ck)?'closed':'')+'"><button class="catHead" style="background:linear-gradient(120deg,'+a+','+b+')" onclick="toggle(\''+ck.replace(/'/g,"\\'")+'\')"><span>'+em+'</span><span>'+esc(catLabel(cat))+'</span><span class="count">'+items.length+' articles</span><span class="arrow">⌄</span></button>'+(editMenus?'<div class="menuEditBar categoryEdit"><span>Catégorie</span><button onclick="renameCat(\''+cat.replace(/'/g,"\\'")+'\')">✎ Nom</button><button onclick="moveCat(\''+cat.replace(/'/g,"\\'")+'\',-1)">↑</button><button onclick="moveCat(\''+cat.replace(/'/g,"\\'")+'\',1)">↓</button></div>':'')+'<div class="catBody">';const ordered=familyOrder(cat,Object.keys(groups));ordered.forEach(f=>{const arr=groups[f];if(!arr)return;arr.sort((a,b)=>(a.name||'').localeCompare(b.name||'','fr',{sensitivity:'base'})||(a.packaging||'').localeCompare(b.packaging||'','fr',{sensitivity:'base'}));const gk=cat+':'+f,total=arr.reduce((s,p)=>s+(Number(p.quantity)||0),0),pic=arr.find(p=>p.photo_url)?.photo_url;html+='<div class="group '+(isClosed(gk)?'closed':'')+'">'+(editMenus?'<div class="menuEditBar familyEdit"><span>Menu '+esc(familyLabel(cat,f))+'</span><button onclick="renameFamily(\''+cat.replace(/'/g,"\\'")+'\',\''+f.replace(/'/g,"\\'")+'\')">✎ Nom</button><button onclick="moveFamily(\''+cat.replace(/'/g,"\\'")+'\',\''+f.replace(/'/g,"\\'")+'\',-1)">↑</button><button onclick="moveFamily(\''+cat.replace(/'/g,"\\'")+'\',\''+f.replace(/'/g,"\\'")+'\',1)">↓</button></div>':'')+'<button class="groupHead" onclick="toggle(\''+gk.replace(/'/g,"\\'")+'\')">'+(pic?'<img class="groupThumb" src="'+esc(pic)+'">':'<span class="groupThumb">'+em+'</span>')+'<span><div class="groupName">'+esc(familyLabel(cat,f))+'</div><div class="groupMeta">'+arr.length+' variante'+(arr.length>1?'s':'')+'</div></span><span class="groupQty">'+total.toLocaleString('fr-FR')+'</span><span class="groupArrow">⌄</span></button><div class="variants">';arr.forEach(p=>{const can=['admin','responsable','employe'].includes(profile?.role);html+='<div class="row"><div class="product">'+(p.photo_url?'<img class="thumb" src="'+esc(p.photo_url)+'">':'<span class="thumb"></span>')+'<div><div class="pname">'+esc(p.name)+'</div><div class="meta">'+(p.article_code?'EAN '+esc(p.article_code):'')+'</div></div></div><div class="meta">'+esc(p.packaging||'—')+'</div><div class="meta">'+esc(p.category)+'</div><div class="counter"><button '+(!can?'disabled':'')+' onclick="change(\''+p.id+'\',-1)">−</button><span class="qty '+(Number(p.quantity)===0?'zero':'')+'">'+Number(p.quantity).toLocaleString('fr-FR')+'</span><button class="plus" '+(!can?'disabled':'')+' onclick="change(\''+p.id+'\',1)">+</button></div></div>'});html+='</div></div>'});if(!items.length)html+='<div class="empty">'+(q?'Aucun article correspondant.':'Aucun article dans cette catégorie.')+'</div>';html+='</div></section>'});if(editMenus)html+='<div class="menuEditFooter"><button class="btn" onclick="resetMenuLayout()">↺ Réinitialiser l’organisation</button><span>Les noms et emplacements sont enregistrés sur cet appareil.</span></div>';app.innerHTML=html||'<div class="empty">Aucun produit trouvé.</div>'}
function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('Le serveur met trop de temps à répondre.')),ms))])}
async function waitForSupabase(ms=8000){const start=Date.now();while(Date.now()-start<ms){if(window.supabase?.createClient)return window.supabase;await new Promise(r=>setTimeout(r,120))}throw new Error('Le module de connexion ne s’est pas chargé.')}
render();
async function boot(){const app=document.getElementById('app');try{app.dataset.loading='1';const sb=await waitForSupabase();db=db||sb.createClient(SUPABASE_URL,SUPABASE_KEY);const {data:sd,error:se}=await withTimeout(db.auth.getSession(),5000);if(se)throw se;const session=sd?.session;if(!session){app.innerHTML='<div class="empty"><strong>Session expirée.</strong><br><span class="meta">Retourne sur le stock principal pour te reconnecter.</span><br><br><button class="btn" onclick="location.href=\'index.html\'">← Se reconnecter</button></div>';return}const {data,error}=await withTimeout(db.from('products').select('*').eq('active',true).order('position').order('name'),7000);if(error)throw error;products=data||[];render()}catch(e){console.error(e);app.innerHTML='<div class="empty"><strong>Impossible de charger les articles.</strong><br><span class="meta">'+esc(e?.message||'Erreur inconnue')+'</span><br><br><button class="btn" onclick="boot()">Réessayer</button></div>'}finally{delete app.dataset.loading}}boot();
let uiAudioCtx=null;function playUISound(type='tick'){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;uiAudioCtx=uiAudioCtx||new A();const x=uiAudioCtx;if(x.state==='suspended')x.resume();const o=x.createOscillator(),g=x.createGain(),n=x.currentTime;o.type='sine';o.frequency.setValueAtTime(type==='open'?390:type==='close'?310:520,n);o.frequency.exponentialRampToValueAtTime(type==='open'?470:type==='close'?260:600,n+.055);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(type==='tick'?.018:.024,n+.008);g.gain.exponentialRampToValueAtTime(.0001,n+.085);o.connect(g);g.connect(x.destination);o.start(n);o.stop(n+.09)}catch(e){}}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.closest('.counter')||b.classList.contains('catHead')||b.classList.contains('groupHead'))return;playUISound('tick')},{passive:true});</script></body></html>
